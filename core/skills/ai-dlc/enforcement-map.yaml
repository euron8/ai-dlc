        why: a HARD_BLOCK is operator-gated, so marking it RESOLVED asserts an
          operator adjudication; without a cited, transcript-verified operator
          message that is a lead-authored fabrication (the S290 failure)
    ci_workflow: ~
    fixtures: [tests/fixtures/escalation-citation]

