# Enforcement units that are NOT gate-catalog checks — standalone machinery
# whose dormancy the audit/validator also tracks. Their `id`s are local labels,
# not gate-validation check numbers (validate-mandatory-rules.sh has its own
# internal "Check 1-6" numbering for Rule 18 retro-compliance, distinct from
# the gate catalog above — do not conflate).
non_catalog_units:
  - id: rule-18-retro-compliance
    title: Retro-compliance suite (6 checks, Rule 18 enforcement)
    adjudication: script
    enforcer:
      - core/scripts/validate-mandatory-rules.sh
    ci_workflow: core/ci-templates/validate-retro-compliance.yml

  - id: ci-gate-dormancy
    title: Dormant CI-gate detector (retro-declared gates vs workflows)
    adjudication: script
    enforcer:
      - core/scripts/validate-ci-gates.sh
    ci_workflow: core/ci-templates/validate-ci-gates.yml

  - id: compact-window-ordering
    title: Auto-compact threshold must fire after red and bound degraded running
    adjudication: script
    enforcer:
      - core/scripts/validate-compact-window.sh

  - id: steering-budget
    title: Operator steerability (Rule 29) — no foreground call may outlast the
      steering budget; no operator message may be steamrolled
    adjudication: script
    enforcer:
      - core/scripts/validate-steering-budget.sh
      - core/hooks/ai-dlc-acknowledge.sh
