# ENFORCEMENT_MAP v1
#
# A DERIVED machine index of the gate-validation check catalog -> its
# enforcement binding. This file is NOT a source of truth for check
# semantics: `steps/gate-validation.md` owns every check's scope, procedure,
# and PASS/FAIL rule (its prose is LLM-consumed verbatim, with the rationale
# fused into the directive per rule-authoring.md). What lives ONLY here, in no
# structured form anywhere else in the rulebook, is the answer to one question
# per check: "what actually enforces this — a script, a CI workflow, an
# adversarial fixture, or an in-context LLM judgment?"
#
# Why this exists (not a prose->schema migration of the rulebook):
#   The bindings were scattered across SKILL.md rule bodies, gate-validation.md
#   check bodies, core/scripts/validate-*.sh, and core/ci-templates/*.yml. No
#   single artifact let you ask "which catalog checks have a live machine
#   enforcer" or "is any bound enforcer dormant (file gone / never wired)".
#   That query is what the v0.27.0 machinery-efficacy audit found missing
#   (catalog UNMAPPED; drift defeats attribution). This map answers it.
#
# Self-policing: `scripts/validate-enforcement-map.sh` asserts this file
#   stays in sync with the GATE_MANIFEST block and the CHECK_LOADED anchors in
#   steps/gate-validation.md (so the id/gate_type columns cannot silently
#   drift from the authoritative catalog), and that every enforcer/ci_workflow
#   path below exists on disk (dormant-binding detection). The map has no
#   independent authority — it is only ever a validated view of the catalog.
#
# adjudication values (a CLOSED set — a value outside it is a hole in the escalation
# derivation, not a fourth class; validate-gate-adjudication.sh fails at exit 2 on one):
#   script  — a shell validator decides PASS/FAIL mechanically (CI-enforceable)
#   project — a project-supplied audit script decides (consumer-owned command)
#   lead    — mechanical / state-mutating; the lead performs it inline. NOT adjudicable
#             (a read-only subagent cannot mutate state) and NOT scriptable today. The
#             gate-log append, the announce, the snapshot write/verify, the failure
#             protocol, and the H1 self-test live here.
#   llm     — a read-and-compare judgment check. ESCALATED, once per gate, to a fresh
#             gate-adjudicator subagent (Rule 20 (iv)); the lead adopts its per-check
#             verdicts through fail-closed Check 26 and never evaluates one inline. The
#             escalation predicate is exactly `adjudication == "llm"` intersected with the
#             gate type — one filter, no second list (validate-gate-adjudication.sh
#             --expected derives it). H1/H2 are deliberately NOT llm: escalating the
#             recursion/forgery self-tests into the mechanism they police is a trust
#             circularity.
# Paths are repo-relative (distribution layout). enforcer/ci_workflow are the
#   files a validator stats for existence. fixtures name adversarial self-tests
#   (H1/H2 drive these) under tests/fixtures/.

catalog: core

