  - id: "16"
    title: Stub audit (hot-path files) content verification
    gate_types: [universal]
    adjudication: llm
    enforcer:
      - core/scripts/validate-stub-audit.sh
    call_sites:
      - site: gate-validation.md Check 16
        posture: FAILS the gate on exit 1 and on exit 2; exit 4 is the non-vacuity
          sub-clause
        why: >-
          every element of this check was published as a literal regex -- a marker
          grep, an item-reference regex, a backlog-status regex, a digit-only file:line
          regex, and a length floor beside a density rule given as an exact shell
          pipeline -- and the row carried no enforcer, so an agent performed that
          entirely mechanical comparison by reading a paragraph at every universal
          gate whose changed set touched a hot-path file. The elements had in fact
          already been programmed, inside the fixture's own driver as a restatement of
          them; its header said what that was worth ("It proves the FIXTURE's claim,
          not the ADJUDICATOR's behaviour"). The script is now their single home and
          the fixture drives it. The adjudication stays llm: the script decides the
          elements and reports the COUNT, while whether an empty subject set is
          legitimate at this gate depends on the changed_files derivation, which the
          script cannot see.
    reads:
      - core/scripts/core-paths.sh        # --is-core: drops upstream-owned paths from scope
      - core/skills/ai-dlc/core-manifest.md
    ci_workflow: ~
    fixtures: [tests/fixtures/check-15-bypass]

  - id: "17"
    title: Skill-invocation provenance
    gate_types: [planning, story, retro]
    adjudication: script
    enforcer:
      - core/scripts/validate-provenance-block.sh
      - core/scripts/validate-retro-evidence.sh
    call_sites:
      - site: gate-validation.md Check 17
        posture: FAILS the gate (both must exit 0)
        why: an unprovenanced deliverable cannot be told from one the lead wrote
          itself, which is the whole basis of Rule 20 delivery
      - site: retro.md (party-mode + evidence)
        posture: FAILS the retro
        why: the retro's transcript-artifact claims are the one place forgery is
          cheapest and least visible
    ci_workflow: core/ci-templates/validate-retro-compliance.yml
    fixtures: [tests/fixtures/check-17-bypass]

  - id: "18"
    title: Per-class test-debt audit
    gate_types: [sprint-review]
    adjudication: project   # runs project-supplied per-class audit scripts
    enforcer:
      - core/scripts/validate-audit-anchors.sh
    call_sites:
      - site: gate-validation.md Check 18 (--entries)
        posture: FAILS the gate CLOSED on any non-zero. A malformed entry is a schema
          regression, not a clean file.
      - site: gate-validation.md Check 18 (--prior-sprint-sha)
        posture: FAILS the gate CLOSED on exit 1, which names one of four causes; exit
          2 is a malformed invocation and is fixed, not adjudicated. Exit 0 prints the
          audit base every per-class audit script is then run --since.
        why: >-
          the check published this half as a mechanical predicate -- "resolve
          <prior_sprint_sha> from the most recent prior sprint entry (current sprint
          number minus one); if absent the gate FAILS CLOSED" -- and carried no
          enforcer, so an agent subtracted one and read a file at every sprint-review
          gate. The resolution had already been programmed as a second entry grammar
          inline in validate-mandatory-rules.sh's Check 5, a copy no gate could reach;
          --prior-sprint-sha is now its single home and that caller calls it. The
          adjudication stays project: this binds the audit WINDOW, while the per-class
          verdicts still come from consumer-supplied audit scripts core cannot see.
    reads:
      - _bmad-output/audit-anchors.md     # the entries, and the prior sprint's anchor
      - core/schemas/audit-anchors.json   # the entry field specs and the header region label
    ci_workflow: ~
    fixtures: [tests/fixtures/check5-anchor-base, tests/fixtures/audit-anchors-schema]

  - id: "19"
    title: Self-reflexive Gate 2 self-discrimination map application
    gate_types: [implementation]
    adjudication: llm
    enforcer: []
