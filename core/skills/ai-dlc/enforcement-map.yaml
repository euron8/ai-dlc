    ci_workflow: ~
    fixtures: [tests/fixtures/check-23-draft-stamps]

  - id: "24"
    title: Adversarial cycle convergence (Rule 8) — and the sanctioned exit from a
      hard block
    gate_types: [planning, story]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-adversarial-convergence.sh
      - core/hooks/ai-dlc-acknowledge.sh
      - core/hooks/ai-dlc-continue.sh
    call_sites:
      - site: gate-validation.md Check 24
        posture: FAILS the gate (exit 0 required)
        why: the residue-to-verdict adjudication is the only thing standing between
          an unconverged cycle and a passed planning gate
      - site: ai-dlc-acknowledge.sh (PreToolUse) — THE TEETH
        posture: runtime DENY of Agent/Task/Skill/TaskCreate on --cycle-state exit 3
        why: the gate runs AFTER the cycle is over, so the one signal that means STOP
          had no teeth at the only moment it mattered. v0.57.0 put the guard on Stop,
          which fires only when the lead YIELDS — and Rule 3 plus the continue hook
          exist to make it never yield, so the guard fired on the reference consumer
          by luck. PreToolUse is the only place a dispatch can be denied. Fails OPEN
          on anything but an explicit exit 3; the gate stays the fail-closed backstop.
      - site: ai-dlc-continue.sh (Stop)
        posture: raises the pause flag, blocks the stop once, writes the flow-log entry
        why: surfacing, not enforcement — a human must learn about the stop in the turn
          it happens. It adjudicates nothing: it shells out to the validator, which owns
          ordering (mtime picks the SERIES; the validator picks the PASS)
    resume_contract:
      states: [CONTINUE, CONVERGED, RESOLVED, DIVERGENT, STALLED]
      record: planning-artifacts/s<N>-<artifact>-resolution-p<M>.md
      kinds: [REVERT_REPAIR, CHANGE_APPROACH, CUT_SCOPE, RESTART_CYCLE]
      why_no_freeze: a hard block means CRITICALs rose in text a previous pass had
        already reviewed — text that is ALREADY frozen. Freezing it again removes
        nothing, so the verification pass finds the same CRITICALs and the gate can
        never pass. An enum member that cannot fire reads exactly like one that passes.
        (FREEZE is the remedy for a MOVING ARTIFACT — arm D's scope-grew branch.
        Opposite failure, opposite remedy; conflating them parked a live pipeline.)
      carve_out: the resolution record is WRITEABLE while paused. Check 2a denies every
        dispatch until it exists; if the pause flag also denied the record, the two
        checks would lock the pipeline against itself.
    ci_workflow: ~
    fixtures:
      - tests/fixtures/check-24-adversarial-convergence
      - tests/fixtures/divergence-hard-block

  - id: "25"
    title: Rule 29 bounded-join conduct — the operator was reachable
    gate_types: [universal]
    adjudication: script
    enforcer:
      - core/scripts/validate-steering-budget.sh
    call_sites:
      - site: gate-validation.md Check 25
        posture: FAILS the gate on a NEW violation since the previous gate
        why: the delta is the only question that is both answerable and actionable —
          a starvation window is conduct already committed and cannot be repaired, so
          a raw count would make the gate unpassable, and an unpassable gate gets
          turned off
      - site: ai-dlc-continue.sh (Stop) Check 2b — the yield permission (v0.81.0)
        posture: ALLOWS the stop while a backgrounded wait-beat is live
          (`.beat-inflight` epoch > now); every other marker state falls through to
          the Rule 3 block
        why: the bounded join is a WAIT, and forcing a tool call on every beat made
          the lead ride the forced-continuation churn (45-150 blocks per
          implementation day). The beat is now backgrounded and the lead yields; the
          beat's own exit re-invokes it, so the marker is self-proving of
          re-invocation. Keying the allow on "deliverable absent" instead would
          authorize a yield into a SILENT stall — the marker is written only while a
          real beat sleeps (wait-for-deliverable.sh), and the check fails safe to
          BLOCK on any missing / expired / malformed marker
      - site: wait-for-deliverable.sh — the delivery predicate
        posture: a target counts as delivered only when it is non-empty AND written
          since the join armed; a file that predates the join is treated as pending
        why: a presence-only test reported the PREVIOUS sprint's file at a reused
          deliverable path as delivered in under a second, which is consumed as this
          sprint's input with nothing downstream to re-examine it. It also returned
          before the sleep, so `.beat-inflight` was never written and the lead could
          not yield — the same defect starves Check 2b above. The join epoch is
          captured by the script, not taken from the caller: leads round
          `dispatched-at` UP, and a future threshold no write can satisfy walks the
          counter to a false non-delivery. `--since` is clamped to now for that reason
    ci_workflow: ~
    fixtures:
      - tests/fixtures/check-25-steering-conduct
      - tests/fixtures/implementation-join-yield
      - tests/fixtures/wait-stale-deliverable

  - id: "26"
    title: Gate-check adjudication — every escalated llm check evaluated by the adjudicator and PASS
    gate_types: [universal]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-gate-adjudication.sh
    call_sites:
      - site: gate-validation.md Check 26
        posture: FAILS the gate (verdict.sh validate-gate-adjudication <gate_type> <verdict_path>; exit 0 required)
        why: the lead runs on a cheaper model and escalates every adjudication:llm check for the
          gate type to ONE fresh Opus gate-adjudicator subagent. This is the SINGLE fail-closed
          check through which the lead adopts those per-check verdicts — a missing / malformed /
          stale verdict, an uncovered escalated check, a duplicate, or any FAIL blocks. The lead
          never evaluates an llm check inline (that is a Rule 20 solo violation), so if this check
          is not wired the escalated checks are adjudicated by no one, which reads as clean.
    fixtures: [tests/fixtures/gate-adjudication]
    ci_workflow: ~

  - id: "27"
    title: Routing sanity — a subordinated defect
    gate_types: [planning]
    adjudication: llm   # the gate-adjudicator re-derives signals from user_request_verbatim
    hard_block: true
    enforcer: []        # teeth are Check 26 (fail-closed adoption of the escalated verdict)
    call_sites:
      - site: gate-validation.md Check 27
        posture: FAILS the first planning gate (adopted via Check 26)
        why: a production defect described without the token "bug" (graph S292's
          "fee-display failure" / "wide-mode misreport") was subordinated into a
          carry-over story and run through the full planning cycle; the router's
          bug-signal was keyword-only and the Rule 11 mixed-signal question never
          fired. The adjudicator re-reads the verbatim request rather than the
          router's self-declared booleans — the misclassifying router wrote those,
          so reading them back would pass vacuously on the exact failure.
    ci_workflow: ~
    fixtures: [tests/fixtures/route-defect-classification]

  - id: "H1"
    title: Harness meta-check — self-test fixtures + manifest completeness
    gate_types: [universal]
    adjudication: lead   # deliberately NOT escalated: routing the self-test that polices the
                         # gate machinery THROUGH that machinery is a trust circularity. The
                         # lead runs H1 inline; H1 verifies Check 26's own anchor is loaded.
    enforcer: []
    ci_workflow: ~
    fixtures: [tests/fixtures/check-manifest-bypass]

  - id: "H2"
    title: Harness self-test — recursion guard + forgery + slicing-bypass
    gate_types: [universal]
    adjudication: script   # deliberately NOT escalated (same trust-circularity reason as H1);
                           # the once-per-sprint attestation is script-gated by
                           # validate-h2-attestation.sh, which fails the gate on --attest exit 1
    enforcer:
      - core/scripts/validate-h2-attestation.sh   # --verify/--attest; fails the gate
      - core/scripts/validate-retro-evidence.sh   # drives the seeded forgery fixture
    call_sites:
      - site: gate-validation.md H2
        posture: FAILS the gate (exit 0 required from --verify or --attest)
        why: the harness self-test is the only check that checks the checkers; escalating it
          to the gate-adjudicator would let the delegated mechanism vouch for its own police
    ci_workflow: ~
    fixtures:
      - tests/fixtures/check-h1-recursion
      - tests/fixtures/check-17-bypass
      - tests/fixtures/check-manifest-bypass
      - tests/fixtures/h2-attest-scripts-dir   # the attestation wrapper can DRIVE the above
                                               # from an installed consumer layout

  - id: core-layer-immutability
    title: Core-layer immutability (authoring guard)
    gate_types: [retro]
    adjudication: llm   # git-diff logic run by the lead; reads the manifests below
    reads:
      - core/scripts/core-paths.sh        # --is-core: the core set, derived not restated
      - core/skills/ai-dlc/core-manifest.md
      - core/skills/ai-dlc-update/reconcile/setup-sites.md
    enforcer: []
    ci_workflow: ~

  - id: failure
    title: Gate Failure
    gate_types: [universal]
    adjudication: lead   # a remediation protocol the lead executes, not a judgment to escalate
    enforcer: []
    ci_workflow: ~

# Enforcement units that are NOT gate-catalog checks — standalone machinery
# whose dormancy the audit/validator also tracks. Their `id`s are local labels,
# not gate-validation check numbers (validate-mandatory-rules.sh has its own
# internal "Check 1-6" numbering for Rule 18 retro-compliance, distinct from
# the gate catalog above — do not conflate).
non_catalog_units:
  - id: rule-18-retro-compliance
    title: Retro-compliance suite (6 checks, Rule 18 enforcement)
    adjudication: script
    enforcer:
      - core/scripts/validate-mandatory-rules.sh
    call_sites:
      - site: retro.md (pre-commit validation gate)
        posture: BLOCKS the retro commit
        why: retro is the only step that can record a rule as satisfied, so it is
          the only place the claim can be checked against the artifact
    ci_workflow: core/ci-templates/validate-retro-compliance.yml

  - id: sprint-status-lifecycle
    title: Sprint-status envelope — mechanical sprint_id + atomic freeze/roll-forward
    adjudication: script
    enforcer:
      - core/scripts/sprint-status.sh
    reads:
      - core/schemas/sprint-status.json
    call_sites:
      - site: route.md Step 6 (sprint-id)
        posture: BLOCKS on exit 3 (the two canonical copies disagree on `sprint:`)
        why: pipeline start is the only place the sprint number is derived, and every
          downstream consumer reads it from the snapshot rather than re-deriving it.
          It used to be four prose rules the model applied by hand, with NO case for a
          canonical that exists but carries no `sprint:` key — the state a
          rotate-at-close leaves behind. Read as greenfield, that restamps a live
          project from sprint 1 and destroys the prior sprint's drafts.
      - site: route.md Step 6 (roll)
        posture: BLOCKS on exit 3 (prior sprint not closed, or a frozen archive differs)
        why: the pipeline's ONLY rotation point. Rotation belongs at START, not at
          close: sprint-id must read the closed sprint's `status: done`, and a
          rotate-at-close prunes exactly that block before the successor exists — so
          the number has nowhere to come from and the roll falls to whoever remembers
          to do it by hand.
    checks:
      - id: preamble-only-never-greenfield
        asserts: a canonical with no `sprint:` key resolves from the frozen archives
          (max + 1), never to 1
        protects: the prior sprint's drafts — Rule 24 stamps every analyst-draft write
          path with sprint_id, and an unstamped/restamped fallback silently destroys
          the previous sprint's work
      - id: housekeeping-is-not-a-sprint-block
        asserts: `sprint_<N>_housekeeping:` is never parsed as the sprint envelope,
          and a canonical carrying one still derives N+1
        protects: against the reference consumer's live grammar collision — its
          rotation regex matches ZERO lines of the real canonical (so its sweep
          no-ops and exits 0 reporting success) yet DOES match the housekeeping key,
          which would delete the closure evidence Check 3 requires
      - id: roll-is-idempotent-and-byte-faithful
        asserts: a frozen archive byte-equals the pre-roll canonical, and a re-run
          neither re-freezes nor overwrites it
        protects: the durable per-sprint record (Rule 25(a) move-never-delete)
      - id: never-freeze-live-state
        asserts: roll exits 3 rather than freeze a sprint whose status is not `done`
        protects: the in-flight sprint's story ledger
    fixtures: [tests/fixtures/sprint-status-lifecycle]
    ci_workflow: ~

  - id: validate-mandatory-rules-revive
    title: Retro-compliance validator — un-poisoned; Check 3 enforces the closed envelope
    adjudication: script
    enforcer:
      - core/scripts/validate-mandatory-rules.sh
      - core/scripts/sprint-status.sh
    reads:
      - core/schemas/sprint-status.json
    call_sites:
      - site: retro.md Close-Out Sweep step 3 (sprint-status.sh close)
        posture: writes status:done + the sprint_<N>_housekeeping block
        why: the ONLY producer of the closure block Check 3 reads. Hand-editing
          `status: done` leaves the block unwritten, so Check 3 could never pass —
          the block had no producer at all until this `close` mode.
      - site: retro.md Step 5c (validate-mandatory-rules.sh <N>)
        posture: gates the retro commit
        why: Checks 2 and 4 delegated to sibling scripts core never shipped, and Check 5
          keyed on a "## Gate Log: Sprint N" header no core artifact writes — so the
          validator exited 1 on every real retro since S138, a wired CI gate that could
          never pass. The dead delegations now SKIP (consumer-provided), and Check 3 reads
          the sprint_<N>_housekeeping block that sprint-status.sh `close` writes.
    checks:
      - id: dead-delegation-skips-not-fails
        asserts: Checks 2/4 SKIP (not FAIL) when their consumer-provided sibling is absent,
          and Check 5 SKIPs when it cannot isolate the sprint's gate-log section
        protects: the whole gate from a dead-in-core delegation poisoning every retro
      - id: check-3-enforces-the-closed-envelope
        asserts: Check 3 PASSes on a closed envelope and FAILs on an un-closed one
        protects: against a vacuous revival — the producer (`close`) and the reader
          (Check 3) must agree, and the check must still bite
    fixtures: [tests/fixtures/validate-mandatory-rules-revive]
    ci_workflow: core/ci-templates/validate-retro-compliance.yml

  - id: ci-gate-dormancy
    title: Dormant CI-gate detector (retro-declared gates vs workflows)
    adjudication: script
    enforcer:
      - core/scripts/validate-ci-gates.sh
    call_sites:
      - site: retro.md (empirical gate validation)
        posture: reports; the retro adjudicates
        why: a gate declared in a retro and armed in no workflow is a gate that
          never fires — and it reads, in every later retro, as a gate that passed
    ci_workflow: core/ci-templates/validate-ci-gates.yml

  - id: compact-window-ordering
    title: Context-band lead constants keep yellow < red < imminent < compaction
    adjudication: script
    enforcer:
      - core/scripts/validate-compact-window.sh
    call_sites:
      - site: SKILL.md Rule 2 (context-budget setup)
        posture: advisory — the operator sets autoCompactWindow, the lead verifies
        why: the bands are a clamped percentage of the resolved effective window,
          so red fires before compaction by construction; the script guards the band
          constants (disjoint clamp ranges, monotonic percentages, runway) and reports
          the resolved window, but the window itself is settings state no gate can
          repair, so the honest posture stays "check and tell the operator"

  - id: h2-attestation
    title: H2 harness self-test (gate-validation.md H2) — drives the real fixtures
      once per sprint, pinned to a digest of the fixture set
    adjudication: script
    enforcer:
      - core/scripts/validate-h2-attestation.sh
      - core/fixtures/check-17-bypass/run.sh
    call_sites:
      - site: gate-validation.md H2
        posture: FAILS the gate if the mechanical fixture does not hold, or if no
          valid attestation exists for this sprint at the current fixture digest
        why: the harness self-test is the only check that checks the checkers; if it
          runs nowhere, every fixture below it is decoration
    posture: FAILS the gate if the mechanical fixture does not hold, or if no valid
      attestation exists for this sprint at the current fixture digest
    cadence: once per sprint (was: every gate, 4–6× per planning phase). The fixtures
      are static; a changed byte moves the digest, voids every attestation carrying
      the old one, and forces a full re-drive. Deduplication, not pruning — the check
      keeps every tooth.
    note: H2 was previously VACUOUS, not merely repetitive. All three seed.sh files
      were echo statements describing fixtures never written to disk, so H2
      adjudicated prose. check-17-bypass's V5 additionally carried `mode: solo`,
      short-circuiting validate-provenance-block.sh's Rule 20 assertion before the
      fabricated-SHA byte-match it exists to reach. Both fixed; only item (2) is
      mechanical — items (1) and (3) remain LLM-adjudicated.

  - id: artifact-budget
    title: Artifact-size budgets (Rule 25(d)) — a sprint may not start on top of a
      living artifact it cannot afford to read
    adjudication: script
    enforcer:
      - core/scripts/validate-artifact-budget.sh
    call_sites:
      - site: route.md Step 1a (sprint start)
        posture: HARD_BLOCK
        why: the last moment an oversized artifact is cheap to fix — the sprint has
          not read it yet, and carry-over-evaluation whole-reads brief/prd/
          architecture/backlog one step later (Rule 25(b))
      - site: route.md Step 0a (resume)
        posture: HARD_BLOCK (pipeline-snapshot.md only)
        why: resume skips Steps 1-6, so Step 1a never runs, and Check 14 is AFTER the
          read. This was the one path that whole-read the snapshot with nothing in
          front of it — and route.md was the only file that did not say it whole-reads
          it, contradicting handoff.md, Rule 23(a), and this entry, since the commit
          that introduced the snapshot
      - site: gate-validation.md Check 14
        posture: FAILS the gate (pipeline-snapshot.md only)
        why: the snapshot is the only artifact that grows WITHIN a sprint, and it is
          whole-read at every gate, every resume, and every compaction
      - site: gate-validation.md Check 15 (--check-evidence)
        posture: FAILS the gate
        why: Check 14 runs the budget check and records its own result, so the
          record was the only evidence the record was true. It failed that way — a
          Check 14 cell read "PASS validate-artifact-budget.sh (exit 0)" at a gate
          where the snapshot measured 126% of budget before it and 212% after. The
          arm requires the cell to carry the measurement, which verdict.sh now puts
          in its PASS line and which cannot be transcribed out of the instruction.
      - site: retro.md Close-Out Sweep
        posture: warn-only
        why: the sprint already paid; retro reports, it does not gate
    fixtures:
      - tests/fixtures/snapshot-section-schema
      - tests/fixtures/resume-whole-read
      - tests/fixtures/snapshot-evidence-cell
      - tests/fixtures/inflight-row-shape
      - tests/fixtures/verdict-pass-content
      - tests/fixtures/whole-read-pool
    supersedes: the retro.md prose threshold table, which was warn-only, fired only
      at retro, and drifted from nothing because nothing else executed it; and the
      four per-file planning-artifact constants (prd/product-brief/carry-over-backlog/
      architecture), which had no derivation and whose standing remedy was to relocate
      locked requirements to satisfy them. Replaced by ONE derived number: the four are
      whole-read by exactly one reader (the Rule-24 analyst at carry-over-evaluation
      section 1), so the bound is their SUM against that reader's window. The window is
      resolved from team-roles/analyst.md at run time and falls back to 200K when
      unresolved — core ships that role file as a template, and inheriting the
      reference consumer's 1M would fail this HARD_BLOCK open for everyone else.

  - id: steering-budget
    title: Operator steerability (Rule 29) — no foreground call may outlast the
      steering budget; no operator message may be steamrolled; no wait sequence
      may run past its beat ceiling without a re-dispatch
    adjudication: script
    enforcer:
      - core/scripts/validate-steering-budget.sh
      - core/hooks/ai-dlc-acknowledge.sh
    call_sites:
      - site: gate-validation.md Check 25
        posture: FAILS the gate on a NEW violation since the previous gate
        why: Rule 29 binds every phase that dispatches, and planning dispatches most
          — S290 ran 28 of its 28 spawns there. The delta bound is load-bearing: the
          scan is whole-session, so a raw FAIL would re-report a violation from three
          gates ago forever, could never be remediated, and an unpassable gate gets
          turned off. Compare against the previous gate-log entry's
          steering_violations; only an INCREASE fails.
      - site: retro.md (close-out sweep)
        posture: reports; the retro adjudicates
        why: the sprint has already paid — retro records the conduct, it cannot
          prevent it
      - site: ai-dlc-acknowledge.sh (PreToolUse)
        posture: runtime DENY (Check B only — the pause-flag steamroll)
        why: B is the only one of the four that can be adjudicated before the harm,
          because the flag's state is knowable at call time
    checks:
      - id: A
        asserts: no foreground tool call blocks longer than steering_budget
        protects: the operator's voice — an over-budget call is a window in which
          a queued message cannot land
      - id: B
        asserts: no operator message is followed by a pipeline-advancing call
          before the pause flag is cleared
        protects: the operator's authority — a steer that is executed through was
          not a steer
        excludes: the auto-compaction resume prompt (a harness injection; the lead
          advancing after one is the POST-COMPACT RECOVERY PROTOCOL, not a
          steamroll)
      - id: C
        asserts: no run of foreground _bmad-output/ file-wait beats exceeds
          max_wait_beats (default 10) without an intervening re-dispatch
        protects: liveness, NOT steerability — every beat is a tool boundary, so
          an unbounded wait is a hang, not a gag
        status: dormant — zero catches across 278 consumer sessions. Bounds a shape
          Rule 29 itself introduces (beats become the sanctioned way to wait, so
          beating forever becomes the way to hang). See Rule 29 minimum-mechanism.

  - id: dispatch-model-binding
    title: Teammate dispatch model binding (v0.70.0) — a teammate runs on the model
      its role file pins, and a dispatch that omits the model param does not
      silently inherit the lead's
    adjudication: script
    hard_block: true
    enforcer:
      - core/hooks/ai-dlc-dispatch-guard.sh
    call_sites:
      - site: ai-dlc-dispatch-guard.sh (PreToolUse Agent|Task) — THE ONLY TEETH
        posture: runtime DENY of a role-bound dispatch whose model tier disagrees
          with the role file's pin, or which passes no model param at all
        why: there is NO gate-time backstop and there cannot be one — an
          Agent-spawned teammate leaves no transcript, so nothing downstream can
          learn what model it ran on, and a verdict that self-reports its own
          model is the trust circularity that keeps H1/H2 with the lead. The
          dispatch param is the only observable ground truth and it is observable
          BEFORE the work. Measured on graph S291 (v0.70.0 Sonnet-lead A/B):
          the lead dropped the param on 3 of 42 spawns, so every remediator ran
          Sonnet against an opus pin — and an inherited gate-adjudicator would
          collapse the v0.62.0 Opus escalation to Sonnet-judging-Sonnet while
          Check 26 still passed green.
    checks:
      - id: pin-agreement
        asserts: a dispatch binding team-roles/<role>.md requests a model whose
          tier matches that file's declared pin
        protects: the role file as the single source of truth for a teammate's
          model — v0.62.0's Opus escalation and v0.56.0's fresh-context repair
          both rest on it
      - id: no-silent-inherit
        asserts: a role-bound dispatch names a model explicitly
        protects: against absence reading as assent — an omitted param inherits
          the lead's model, which is luck, not binding
        excludes: roles that declare no pin (cis/sm/tea/ux) — a role file that
          declares nothing cannot bind anything; closing that needs new setup
          placeholders (the v0.63.0 unregistered-drift surface) and is deferred
    fixtures: [tests/fixtures/dispatch-model-guard]
    ci_workflow: ~

  - id: arm-record
    title: Lead arm record (v0.70.0) — which model the lead ran on is written from
      the transcript by a hook, never self-reported
    adjudication: script
    hard_block: false
    enforcer:
      - core/hooks/ai-dlc-context-sensor.sh
    emits: arm-log.jsonl   # {v,ts,sprint,lead_model}, deduped on (sprint, model)
    call_sites:
      - site: ai-dlc-context-sensor.sh (Stop | PostToolBatch)
        posture: appends an arm record on a (sprint, model) change; never blocks
        why: no sprint artifact recorded the arm, so "which arm ran" was
          unfalsifiable from a sprint's own artifacts and the v0.70.0 A/B had to
          be answered by an external script reading ~/.claude/projects. The lead
          must not self-report it: a model naming its own weights is unreliable,
          and a self-reported arm is the same unfalsifiable testimony the finding
          complains about. The sensor already exits on agent_id (main session
          only, so the model it reads IS the lead's) and already holds the correct
          post-compaction record.
    checks:
      - id: transcript-sourced
        asserts: lead_model is read from the transcript's assistant record, not
          asserted by the lead
        protects: falsifiability of any future model A/B
    fixtures: [tests/fixtures/context-sensor]
    ci_workflow: ~

  - id: subagent-context-probe
    title: Subagent context probe (v0.70.0) — measures how close teammates come to
      the compaction threshold, and whether any actually compact
    adjudication: script
    hard_block: false
    enforcer:
      - core/hooks/ai-dlc-subagent-probe.sh
    emits: subagent-context.jsonl   # {v,ts,sprint,agent_id,model,turns,peak_tokens,compactions}
    call_sites:
      - site: ai-dlc-subagent-probe.sh (SubagentStop)
        posture: records only; NEVER blocks (a blocking SubagentStop hook hangs a teammate)
        why: the lead is netted around compaction (snapshot, precompact sidecar,
          recovery protocol, context sensor). A teammate has NONE of it and runs in
          its own window — the sensor deliberately exits on agent_id. If a teammate
          compacts it silently loses the middle of its task and returns a confident,
          degraded verdict. That risk was argued but never measured, because
          teammates leave no transcript in ~/.claude/projects; SubagentStop hands us
          transcript_path at the one moment the teammate's own transcript is complete.
          It is the only window there is, and it is what makes the autoCompactWindow
          question answerable with data instead of a guess.
    checks:
      - id: peak-not-last
        asserts: peak_tokens is the maximum across the run, including before any
          compact_boundary
        protects: the ceiling decision — reporting the LAST reading would show a
          teammate that compacted at 286K as a calm 41K, which is worse than no
          reading at all
      - id: never-blocks
        asserts: the hook emits nothing on stdout and always exits 0
        protects: teammate liveness
    fixtures: [tests/fixtures/subagent-probe]
    ci_workflow: ~
