  - id: core-layer-immutability
    title: Core-layer immutability (authoring guard)
    gate_types: [retro]
    adjudication: llm   # git-diff logic run by the lead; reads the manifests below
    reads:
      - core/skills/ai-dlc/core-manifest.md
      - core/skills/ai-dlc-update/reconcile/setup-sites.md
    enforcer: []
