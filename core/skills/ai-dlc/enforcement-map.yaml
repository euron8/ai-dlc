        why: Check 2's own predicate is three branches with no else, so an entry
          on a token outside the published set is neither blocked, surfaced nor
          recorded — no verdict is computed for it and the gate reports PASS.
          The script guards the vocabulary the LLM adjudication branches on; the
          adjudication itself stays llm.
