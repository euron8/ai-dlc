  - id: "22"
    title: Teammate-spawn role binding
    gate_types: [implementation]
    adjudication: llm
    enforcer:
      - core/scripts/validate-spawn-ledger.sh
      - core/scripts/validate-escalation-resolution.sh
    call_sites:
      - site: gate-validation.md Check 22 (spawn rows)
        posture: FAILS the gate on exit 1 and on exit 2; exit 3 is PRE-LEDGER and
          hands the verdict back to the gate log's spawn table
        why: the check published three field comparisons per ledger row -- model_bound
          against aiDlcRoles.<role>.model, role_contract_cited true, role_file_readable
          not false -- and the row carried no enforcer, so a teammate performed all
          three by reading a paragraph at every implementation-phase gate. The
          comparison was already programmed in ai-dlc-dispatch-guard.sh, which is
          where model_bound gets its value, but a PreToolUse hook cannot run at a
          gate; pin_key() and matches_pin() are now shared byte-identically and I56
          binds them. The adjudication stays llm because the four-arm disposition of
          a recorded tier mismatch turns on arm 4 (the entry states a remediation and
          names its artifact), and because story routing needs the sprint's story
          files, which the ledger does not name.
      - site: gate-validation.md Check 22 (clearing condition 3)
        posture: FAILS the gate (exit 0 required) on any spawn the operator is
          asked to have dispositioned
        why: clearing a recorded Rule 19(a) mismatch asserts an operator
          authorization, and the same invocation Check 2a makes is what makes that
          assertion unforgeable. Check 2a's row bound this validator and Check 22's
          named it under reads:, so a numbered clearing condition stating an exit
          code was carried as a citation
    reads:
      - _bmad-output/spawn-ledger.jsonl   # written at dispatch by ai-dlc-dispatch-guard.sh
      - core/team-roles/*.md              # the roles whose config pin each row is compared against
      - docs/escalations/pending.md       # OVERRIDDEN entry dispositioning a recorded 19(a) violation
    ci_workflow: ~
    fixtures: [tests/fixtures/check-22-spawn-ledger, tests/fixtures/dispatch-model-guard, tests/fixtures/subagent-probe]

  - id: "23"
    title: Per-sprint planning-artifact sprint stamps (Rule 24)
    gate_types: [planning]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-draft-stamps.sh
    call_sites:
      - site: gate-validation.md Check 23
        posture: FAILS the gate (exit 0 required)
        why: a draft carrying the wrong sprint stamp is indistinguishable from a
          current one once the sprint reads it
    ci_workflow: ~
    fixtures: [tests/fixtures/check-23-draft-stamps]

  - id: "24"
    title: Adversarial cycle convergence (Rule 8) — and the sanctioned exit from a
      hard block
    gate_types: [planning, story]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-adversarial-convergence.sh
      - core/hooks/ai-dlc-acknowledge.sh
      - core/hooks/ai-dlc-continue.sh
    call_sites:
      - site: gate-validation.md Check 24
        posture: FAILS the gate (exit 0 required)
        why: the residue-to-verdict adjudication is the only thing standing between
          an unconverged cycle and a passed planning gate
      - site: ai-dlc-acknowledge.sh (PreToolUse) — THE TEETH
        posture: runtime DENY of Agent/Task/Skill/TaskCreate on --cycle-state exit 3
        why: the gate runs AFTER the cycle is over, so the one signal that means STOP
          had no teeth at the only moment it mattered. v0.57.0 put the guard on Stop,
          which fires only when the lead YIELDS — and Rule 3 plus the continue hook
          exist to make it never yield, so the guard fired on the reference consumer
          by luck. PreToolUse is the only place a dispatch can be denied. Fails OPEN
          on anything but an explicit exit 3; the gate stays the fail-closed backstop.
      - site: ai-dlc-continue.sh (Stop)
        posture: raises the pause flag, blocks the stop once, writes the flow-log entry
        why: >-
          surfacing, not enforcement — a human must learn about the stop in the turn
          it happens. It adjudicates nothing: it shells out to the validator, which owns
          ordering (mtime picks the SERIES; the validator picks the PASS)
    resume_contract:
      states: [CONTINUE, CONVERGED, RESOLVED, DIVERGENT, STALLED]
      record: planning-artifacts/s<N>/<artifact>-resolution-p<M>.md
      kinds: [REVERT_REPAIR, CHANGE_APPROACH, CUT_SCOPE, RESTART_CYCLE]
      why_no_freeze: a hard block means CRITICALs rose in text a previous pass had
        already reviewed — text that is ALREADY frozen. Freezing it again removes
        nothing, so the verification pass finds the same CRITICALs and the gate can
        never pass. An enum member that cannot fire reads exactly like one that passes.
        (FREEZE is the remedy for a MOVING ARTIFACT — arm D's scope-grew branch.
        Opposite failure, opposite remedy; conflating them parked a live pipeline.)
      carve_out: the resolution record is WRITEABLE while paused. Check 2a denies every
        dispatch until it exists; if the pause flag also denied the record, the two
        checks would lock the pipeline against itself.
    ci_workflow: ~
    fixtures:
      - tests/fixtures/check-24-adversarial-convergence
      - tests/fixtures/divergence-hard-block

  - id: "25"
    title: Rule 29 bounded-join conduct — the operator was reachable
    gate_types: [universal]
    adjudication: script
    enforcer:
      - core/scripts/validate-steering-budget.sh
    call_sites:
      - site: gate-validation.md Check 25
        posture: FAILS the gate on a NEW violation since the previous gate
        why: the delta is the only question that is both answerable and actionable —
          a starvation window is conduct already committed and cannot be repaired, so
          a raw count would make the gate unpassable, and an unpassable gate gets
          turned off
      - site: ai-dlc-continue.sh (Stop) Check 2b — the yield permission (v0.81.0)
        posture: ALLOWS the stop while a backgrounded wait-beat is live
          (`.beat-inflight` epoch > now); every other marker state falls through to
          the Rule 3 block
        why: >-
          the bounded join is a WAIT, and forcing a tool call on every beat made
          the lead ride the forced-continuation churn (45-150 blocks per
          implementation day). The beat is now backgrounded and the lead yields; the
          beat's own exit re-invokes it, so the marker is self-proving of
          re-invocation. Keying the allow on "deliverable absent" instead would
          authorize a yield into a SILENT stall — the marker is written only while a
          real beat sleeps (wait-for-deliverable.sh), and the check fails safe to
          BLOCK on any missing / expired / malformed marker. v0.167.0 made the
          marker a re-stamped LEASE (`now + 3*POLL`, rewritten each poll) rather
          than the beat's end epoch written once: a SIGKILLed beat skips its EXIT
          trap, and under the old shape this check kept authorizing the yield for
          the whole remaining quantum with nothing alive to re-invoke the lead.
          A lease expires ~30s after the beat dies whatever the quantum is, which
          is what let the quantum grow from 120s to 600s
      - site: wait-for-deliverable.sh — the delivery predicate
        posture: a target counts as delivered only when it is non-empty AND written
          since the join armed; a file that predates the join is treated as pending
        why: >-
          a presence-only test reported the PREVIOUS sprint's file at a reused
          deliverable path as delivered in under a second, which is consumed as this
          sprint's input with nothing downstream to re-examine it. It also returned
          before the sleep, so `.beat-inflight` was never written and the lead could
          not yield — the same defect starves Check 2b above. The join epoch is
          captured by the script, not taken from the caller: leads round
          `dispatched-at` UP, and a future threshold no write can satisfy walks the
          counter to a false non-delivery. `--since` is clamped to now for that reason
    ci_workflow: ~
    fixtures:
      - tests/fixtures/check-25-steering-conduct
      - tests/fixtures/implementation-join-yield
      - tests/fixtures/wait-stale-deliverable

  - id: "26"
    title: Gate-check adjudication — every escalated llm check evaluated by the adjudicator and PASS
    gate_types: [universal]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-gate-adjudication.sh
    call_sites:
      - site: gate-validation.md Check 26
        posture: FAILS the gate (verdict.sh validate-gate-adjudication <gate_type> <verdict_path>; exit 0 required)
        why: the lead runs on a cheaper model and escalates every adjudication:llm check for the
          gate type to ONE fresh Opus gate-adjudicator subagent. This is the SINGLE fail-closed
          check through which the lead adopts those per-check verdicts — a missing / malformed /
          stale verdict, an uncovered escalated check, a duplicate, or any FAIL blocks. The lead
          never evaluates an llm check inline (that is a Rule 20 solo violation), so if this check
          is not wired the escalated checks are adjudicated by no one, which reads as clean.
    fixtures: [tests/fixtures/gate-adjudication]
    ci_workflow: ~

  - id: "27"
    title: Routing sanity — a subordinated defect
    gate_types: [planning]
    adjudication: llm   # the gate-adjudicator re-derives signals from user_request_verbatim
    hard_block: true
    enforcer: []        # teeth are Check 26 (fail-closed adoption of the escalated verdict)
    call_sites:
      - site: gate-validation.md Check 27
        posture: FAILS the first planning gate (adopted via Check 26)
        why: a production defect described without the token "bug" (graph S292's
          "fee-display failure" / "wide-mode misreport") was subordinated into a
          carry-over story and run through the full planning cycle; the router's
          bug-signal was keyword-only and the Rule 11 mixed-signal question never
          fired. The adjudicator re-reads the verbatim request rather than the
          router's self-declared booleans — the misclassifying router wrote those,
          so reading them back would pass vacuously on the exact failure.
    ci_workflow: ~
    fixtures: [tests/fixtures/route-defect-classification]

  - id: "28"
    title: Spec-layer adoption is declared
    gate_types: [planning]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-spec-adoption.sh
    call_sites:
      - site: gate-validation.md Check 28
        posture: FAILS the gate on exit 2 (PENDING) or exit 1 (malformed)
        why: the alternative — skipping the spec checks whenever no spec artifact is
          present — cannot be told apart from the failure it masks. A project that
          never adopts, one that adopted and quietly stopped, and one with a perfect
          spec all print the same nothing. The floor turns the skip into a token in
          the gate log and the absence into a HARD_BLOCK.
      - site: core/git-hooks/pre-push (--report)
        posture: prints, never blocks
        why: an undeclared floor is visible on every push without gating anyone
    ci_workflow: ~
    fixtures: [tests/fixtures/spec-adoption-floor]

  - id: "29"
    title: Spec kernel integrity — Spec Law re-graded, EARS success fields
    gate_types: [planning]
    adjudication: llm   # a fresh gate-adjudicator re-grades; teeth are Check 26
    hard_block: true
    enforcer: []        # no script can judge whether an intent describes WHAT or HOW
    call_sites:
      - site: gate-validation.md Check 29
        posture: FAILS the planning gate (adopted via Check 26)
        why: >-
          BMAD's Self-Validate is run by the agent that authored the spec, and a
          law graded by its own author is a law with no enforcer. The clause that
          carries the weight is the EARS form on each capability's success field: a
          success signal naming a config value instead of an observable response is
          how a config-delta requirement passed discovery, research, architecture
          and three gates with no acceptance criterion able to catch its inertness.
    ci_workflow: ~
    fixtures: []        # llm-adjudicated; no fixture can stand in for the judgement

  - id: "30"
    title: Spec join integrity — LR -> CAP -> FR -> story
    gate_types: [story]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-spec-join.sh
    call_sites:
      - site: gate-validation.md Check 30
        posture: FAILS the gate (exit 0 required; exit 2 is a FAIL, not a skip)
        why: the chain's middle joins were hand-typed prose arrows nothing read, so a
          locked requirement could stop being mentioned with every downstream
          artifact staying internally consistent. It also DECIDES two verdicts BMAD
          produces and never acts on — lint_spine.py exits 0 by design and leaves the
          call to its caller, and a testarch-trace decision of FAIL is otherwise just
          a line in a report.
    ci_workflow: ~
    fixtures: [tests/fixtures/spec-join-integrity]

  - id: "31"
    title: Acceptance-criterion falsifiability
    gate_types: [story]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-ac-falsifiability.sh
    call_sites:
      - site: gate-validation.md Check 31
        posture: FAILS the gate (exit 0 required)
        why: Check 3a asks whether the ACs COVER the requirement and never reads
          whether an individual AC states a predicate a verifier can fail. An AC can
          cover every element of its requirement and assert nothing.
      - site: stories-test-strategy.md (Discriminating-AC Authoring Standard)
        posture: advisory — declares the forbidden terms and the AC header form
        why: the term list lives in exactly one place and the validator reads it from
          there; a second copy drifts and a drifted copy under-fires silently
    ci_workflow: ~
    fixtures: [tests/fixtures/check-31-ac-falsifiability]

  - id: "32"
    title: Every BMAD invocation resolves to a file that exists
    gate_types: [planning]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-bmad-invocations.sh
    call_sites:
      - site: gate-validation.md Check 32
        posture: FAILS the gate (exit 0 required; deprecations are reported only)
        why: >-
          BMAD ships dead loader shims beside live self-contained skills under
          names differing by one word, so a directory-existence check passes on a
          skill that loads nothing and the lead reports running a workflow that never
          ran. Four such call sites were live in this rulebook when the check was
          written. The enumerator reads a CALL-SITE GRAMMAR, not a bare slash: a
          sigil cannot follow a path character and is not followed by a separator.
          Requiring only the slash counted `fixtures/bmad-invocation-resolve/**`
          — a line in this rulebook's OWN manifest, naming this check's OWN fixture
          — as an invocation of a skill nobody wrote, and shipped that FAIL to every
          consumer for the life of the arm.
    ci_workflow: ~
    fixtures: [tests/fixtures/bmad-invocation-resolve]

  - id: "33"
    title: Every identifier the operator named reaches this sprint's declared scope
    gate_types: [planning]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-request-coverage.sh
    call_sites:
      - site: gate-validation.md Check 33
        posture: FAILS the gate (exit 0 required; exit 2 on absent evidence is also a FAIL)
        why: >-
          every byte-level guarantee in the pipeline terminates at product-brief.md
          — Check 3b anchors stories to it, Check 30 joins capabilities through it —
          and the brief is the LEAD's restatement of an ask it received across a hop
          with NO mechanical join. A plan can therefore be perfectly self-consistent
          from the brief forward while sharing nothing with what was asked. Measured:
          a request naming six identifiers produced a LOCKED block containing none of
          them, three unrelated stories, and four consecutive green gates. Coverage is
          measured only inside bullets headed by an LR id of THIS sprint, because
          briefs accumulate one block per sprint and cite each other constantly —
          reading the whole block scores the PREVIOUS sprint's references as coverage
          and passes the exact failure. Check 27 was the nearest existing check and
          could never have caught this: its subject is a subordinated DEFECT, and it
          carries enforcer:[] besides.
    ci_workflow: ~
    fixtures: [tests/fixtures/request-coverage]

  - id: "34"
    title: The operator saw the resolved scope before the sprint planned against it
    gate_types: [planning]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-scope-confirmation.sh
    call_sites:
      - site: gate-validation.md Check 34
        posture: FAILS the gate (exit 0 required; exit 2 on an absent snapshot is also
          a FAIL, exit 3 is PENDING and reported)
        why: >-
          Rule 3(d) makes the sprint-scope pause point at route.md Step 6 mandatory,
          and a mandate with no enforcer is a suggestion. Every other Rule 3 pause point
          is downstream of implementation, so a sprint that never reaches implementation
          had structurally nowhere to ask: one ran seven days, wrote zero lines of
          product code, planned three stories sharing not one identifier with the ask,
          passed four consecutive gates, and filed all three of its blocking questions on
          day 7 — without breaking a single rule. The boolean alone would be worthless,
          because the lead that misresolved the scope also writes the field attesting an
          operator blessed it; scope_confirmed_cite resolves into
          operator-answers-history.md, which the PostToolUse hook writes from its own
          payload before any agent sees it and whose hash covers the ANSWER, never the
          lead-authored question. Kept OUT of Check 33 deliberately: that check reports
          NOT-APPLICABLE when the ask names no identifier, which was 5 of 23 measured
          requests, so an arm inside it would go silent on a fifth of sprints while
          printing a clean line. "No scope_confirmed field" is deliberately NOT a PENDING
          cause — it is indistinguishable from a skipped pause point and would fail open
          on the conduct the check exists to catch.
    ci_workflow: ~
    fixtures: [tests/fixtures/scope-confirmation]

  - id: "35"
    title: Snapshot content that left the file went somewhere
    gate_types: [planning]
    adjudication: script
    hard_block: true
    enforcer:
      - core/scripts/validate-snapshot-conservation.sh
    call_sites:
      - site: gate-validation.md Check 35
        posture: FAILS the gate (exit 0 required; exit 2 is a FAIL because a check that
          could not evaluate has not passed)
        why: >-
          Rule 25(a) says superseded snapshot content MOVES to a history file and is
          never deleted, and nothing verified the move. Every mechanism around that rule
          measures the file's SIZE, and a file that got smaller looks identical whether
          the bytes were relocated or dropped — so validate-artifact-budget.sh passes
          either way. Measured in the reference consumer over one sprint: of 2,524
          substantive lines removed from the snapshot, 2,141 exist nowhere in the
          repository, and they are the sprint's own gate dispositions, operator override
          citations and adversarial verdicts. The obvious join — deletions must be
          matched by history additions — was measured and REFUTED: six of the seven
          largest evictions did write to the history file in the same commit and four of
          those still destroyed 75% or more, the clearest deleting 244 lines, moving 61,
          and leaving a note saying the content had been moved and could be read there.
          The predicate is therefore survival, not coverage. The floor of 40 is read off
          a measured bimodal distribution rather than chosen: per-commit destroyed counts
          run 1..35 and then jump to 62, so any floor in 36..62 selects the same commits.
          Replayed across 9 gate intervals it fires on 3, covering 94% of all destroyed
          lines, while the two LARGEST removals (551 and 452 lines) pass because their
          content was genuinely conserved — it discriminates a bulk move from a bulk
          deletion rather than flagging large diffs.
    ci_workflow: ~
    fixtures: [tests/fixtures/snapshot-conservation]


  - id: "H1"
    title: Harness meta-check — self-test fixtures + manifest completeness
    gate_types: [universal]
    adjudication: lead   # deliberately NOT escalated: routing the self-test that polices the
                         # gate machinery THROUGH that machinery is a trust circularity. The
                         # lead runs H1 inline; H1 verifies Check 26's own anchor is loaded.
    enforcer: []
    ci_workflow: ~
    fixtures: [tests/fixtures/check-manifest-bypass]

  - id: "H2"
    title: Harness self-test — recursion guard + forgery + slicing-bypass
    gate_types: [universal]
    adjudication: script   # deliberately NOT escalated (same trust-circularity reason as H1);
                           # the once-per-sprint attestation is script-gated by
                           # validate-h2-attestation.sh, which fails the gate on --attest exit 1
    enforcer:
      - core/scripts/validate-h2-attestation.sh   # --verify/--attest; fails the gate
      - core/scripts/validate-retro-evidence.sh   # drives the seeded forgery fixture
    call_sites:
      - site: gate-validation.md H2
        posture: FAILS the gate (exit 0 required from --verify or --attest)
        why: the harness self-test is the only check that checks the checkers; escalating it
          to the gate-adjudicator would let the delegated mechanism vouch for its own police
    ci_workflow: ~
    fixtures:
      - tests/fixtures/check-h1-recursion
      - tests/fixtures/check-17-bypass
      - tests/fixtures/check-manifest-bypass
      - tests/fixtures/h2-attest-scripts-dir   # the attestation wrapper can DRIVE the above
                                               # from an installed consumer layout

  - id: core-layer-immutability
    title: Core-layer immutability (authoring guard)
    gate_types: [retro]
    adjudication: llm   # the two carve-outs are the lead's; the diff classification is not
    reads:
      - core/scripts/core-paths.sh        # --is-core: the core set, derived not restated
      - core/skills/ai-dlc/core-manifest.md
      - core/skills/ai-dlc-update/reconcile/setup-sites.md
    enforcer:
      - core/scripts/core-paths.sh
    call_sites:
      - site: gate-validation.md core-layer-immutability
        posture: FAILS the gate on exit 1; exit 2 is "the core set could not be resolved"
          and is not a pass either
        why: >-
          v0.199.0 gave this check its executable and left this row reading
          `enforcer: []`, so the one check that calls itself the BACKSTOP for an
          in-place core edit was registered as having nothing behind it. The row is
          how "which catalog checks have a live machine enforcer" is answered, and
          it answered wrong about the check guarding the rule that keeps a
          consumer's core tree pullable. The adjudication stays llm because the two
          carve-outs the check applies on top — override coverage and declared
          setup-substitution line regions — are judgement the mode does not make.
    ci_workflow: ~
    fixtures: [tests/fixtures/core-paths-audit-diff]

  - id: failure
    title: Gate Failure
    gate_types: [universal]
    adjudication: lead   # the lead DRIVES the protocol and owns the verdict; a dispatched remediator performs the edits
    enforcer:
      - core/scripts/validate-gate-adjudication.sh   # --series: the stall rung step 4 escalates on
    call_sites:
      - site: gate-validation.md Gate Failure step 4
        posture: exit 0 required after every recorded pass; a non-zero --series exit
          is a check_id holding FAIL across three consecutive passes of one
          gate_series_id, and obliges the HARD_BLOCK escalation
        why: >-
          the protocol already ended in "if still failing after remediation,
          escalate as HARD_BLOCK per Rule 12" with nothing counting the passes, so
          the escalation fired on the lead's recollection. Measured on the reference
          consumer, one check held FAIL for seven consecutive passes and
          hard_block_count stayed at 0. adjudication stays lead because WHICH
          remediation to dispatch and whether to reset the series are the lead's
          calls; the pass count is not.
          hard_block is deliberately ABSENT here, not overlooked. MEASURED across the
          whole tree: NO program parses this field. The four core/scripts that name it
          (validate-request-coverage, validate-locked-anchor, validate-gate-adjudication,
          validate-suppression-lifetime) name it only in COMMENTS, and every other hit
          is prose or the unrelated retro fields hard_block_count / hard_block_class[] /
          hard_block_fail. Control: the same search for `gate_types`, a field that IS
          parsed, returns validate-gate-manifest.sh, validate-layer-entries.sh,
          validate-stub-audit.sh and more. So the field is a DECLARATION for readers of
          this file, and on this row it would declare a category error: it says a FAIL
          of its own row is a hard block, and this row has no verdict of its own — step
          4 escalates the FAILING CHECK, so the hard block belongs to that check's row.
          38 of 57 rows omit the field; omission is the normal state, not a gap. What
          would change this: a program that reads hard_block and acts on it, at which
          point what this row should declare has to be re-decided against that reader.
    ci_workflow: ~

# Enforcement units that are NOT gate-catalog checks — standalone machinery
# whose dormancy the audit/validator also tracks. Their `id`s are local labels,
# not gate-validation check numbers (validate-mandatory-rules.sh has its own
# internal "Check 1-6" numbering for Rule 18 retro-compliance, distinct from
# the gate catalog above — do not conflate).
non_catalog_units:
  - id: rule-18-retro-compliance
    title: Retro-compliance suite (6 checks, Rule 18 enforcement)
    adjudication: script
    enforcer:
      - core/scripts/validate-mandatory-rules.sh
    call_sites:
      - site: retro.md (pre-commit validation gate)
        posture: BLOCKS the retro commit
        why: retro is the only step that can record a rule as satisfied, so it is
          the only place the claim can be checked against the artifact
    ci_workflow: core/ci-templates/validate-retro-compliance.yml

  - id: sprint-status-lifecycle
    title: Sprint-status envelope — mechanical sprint_id + atomic freeze/roll-forward
    adjudication: script
    enforcer:
      - core/scripts/sprint-status.sh
    reads:
      - core/schemas/sprint-status.json
    call_sites:
      - site: route.md Step 6 (sprint-id)
        posture: BLOCKS on exit 3 (the two canonical copies disagree on `sprint:`)
        why: pipeline start is the only place the sprint number is derived, and every
          downstream consumer reads it from the snapshot rather than re-deriving it.
          It used to be four prose rules the model applied by hand, with NO case for a
          canonical that exists but carries no `sprint:` key — the state a
          rotate-at-close leaves behind. Read as greenfield, that restamps a live
          project from sprint 1 and destroys the prior sprint's drafts.
      - site: route.md Step 6 (roll)
        posture: BLOCKS on exit 3 (prior sprint not closed, or a frozen archive differs)
        why: >-
          the pipeline's ONLY rotation point. Rotation belongs at START, not at
          close: sprint-id must read the closed sprint's `status: done`, and a
          rotate-at-close prunes exactly that block before the successor exists — so
          the number has nowhere to come from and the roll falls to whoever remembers
          to do it by hand.
    checks:
      - id: preamble-only-never-greenfield
        asserts: a canonical with no `sprint:` key resolves from the frozen archives
          (max + 1), never to 1
        protects: the prior sprint's drafts — Rule 24 stamps every analyst-draft write
          path with sprint_id, and an unstamped/restamped fallback silently destroys
          the previous sprint's work
      - id: housekeeping-is-not-a-sprint-block
        asserts: >-
          `sprint_<N>_housekeeping:` is never parsed as the sprint envelope,
          and a canonical carrying one still derives N+1
        protects: against the reference consumer's live grammar collision — its
          rotation regex matches ZERO lines of the real canonical (so its sweep
          no-ops and exits 0 reporting success) yet DOES match the housekeeping key,
          which would delete the closure evidence Check 3 requires
      - id: roll-is-idempotent-and-byte-faithful
        asserts: a frozen archive byte-equals the pre-roll canonical, and a re-run
          neither re-freezes nor overwrites it
        protects: the durable per-sprint record (Rule 25(a) move-never-delete)
      - id: never-freeze-live-state
        asserts: roll exits 3 rather than freeze a sprint whose status is not `done`
        protects: the in-flight sprint's story ledger
    fixtures: [tests/fixtures/sprint-status-lifecycle]
    ci_workflow: ~

  - id: validate-mandatory-rules-revive
    title: Retro-compliance validator — un-poisoned; Check 3 enforces the closed envelope
    adjudication: script
    enforcer:
      - core/scripts/validate-mandatory-rules.sh
      - core/scripts/sprint-status.sh
    reads:
      - core/schemas/sprint-status.json
    call_sites:
      - site: retro.md Close-Out Sweep step 3 (sprint-status.sh close)
        posture: writes status:done + the sprint_<N>_housekeeping block
        why: >-
          the ONLY producer of the closure block Check 3 reads. Hand-editing
          `status: done` leaves the block unwritten, so Check 3 could never pass —
          the block had no producer at all until this `close` mode.
      - site: retro.md Step 5c (validate-mandatory-rules.sh <N>)
        posture: gates the retro commit
        why: >-
          Checks 2 and 4 delegated to sibling scripts core never shipped, and Check 5
          keyed on a "## Gate Log: Sprint N" header no core artifact writes — so the
          validator exited 1 on every real retro since S138, a wired CI gate that could
          never pass. The dead delegations now SKIP (consumer-provided), and Check 3 reads
          the sprint_<N>_housekeeping block that sprint-status.sh `close` writes.
    checks:
      - id: dead-delegation-skips-not-fails
        asserts: Checks 2/4 SKIP (not FAIL) when their consumer-provided sibling is absent,
          and Check 5 SKIPs when it cannot isolate the sprint's gate-log section
        protects: the whole gate from a dead-in-core delegation poisoning every retro
      - id: check-3-enforces-the-closed-envelope
        asserts: Check 3 PASSes on a closed envelope and FAILs on an un-closed one
        protects: against a vacuous revival — the producer (`close`) and the reader
          (Check 3) must agree, and the check must still bite
    fixtures: [tests/fixtures/validate-mandatory-rules-revive]
    ci_workflow: core/ci-templates/validate-retro-compliance.yml

  - id: mandatory-rules-skip-accounting
    title: Retro-compliance summary — a SKIPPED check is not a PASSED one
    adjudication: script
    enforcer:
      - core/scripts/validate-mandatory-rules.sh
    call_sites:
      - site: retro.md Step 5c (validate-mandatory-rules.sh <N>)
        posture: still exits 0 on a skip; the VERDICT LINE changes, not the gate
        why: >-
          the un-poisoning above made Checks 2/4/5 SKIP rather than fail, which was
          correct and left the summary saying `all 6 checks passed` on a run where
          three of them had not executed. Both roads to exit 0 shared one sentence, and
          retro.md accepts this validator on its exit code alone, so nothing downstream
          could tell them apart. Measured on the reference consumer: two checks SKIPPED
          on every sprint 296 through 302 because `validate-retro-prereq.sh` was never
          provided, so seven consecutive retros closed against a six-verified claim
          whose true floor was four.
    checks:
      - id: skip-floor-is-reported
        asserts: a run with N distinct skips prints `PASS WITH SKIPS`, names the skipped
          check numbers, and states a verified floor of 6-N; a run with none prints the
          unqualified `all 6 checks passed` and neither the headline nor the word SKIPPED
        protects: against the pre-fix state where the two roads to exit 0 were one
          sentence, and against the inverse — a zero-skip run reported as a skipping one
      - id: a-failure-still-wins
        asserts: a run carrying both a skip and a real check failure exits 1 under the
          FAIL summary and never reaches the skip accounting
        protects: the gate itself — the accounting must buy a truer sentence, not a
          softer verdict
      - id: the-count-survives-the-empty-case
        asserts: the zero-skip count is derived by word, not by a `grep -c` whose
          `|| echo 0` fallback appends a second line to an already-`0` output
        protects: against the draft spelling, which made `[ -eq 0 ]` and then
          `$(( ))` fatal and aborted the script at rc=1 on exactly the clean retros
          it was not written for
    fixtures: [tests/fixtures/mandatory-rules-skip-accounting]
    ci_workflow: core/ci-templates/validate-retro-compliance.yml

  - id: ci-gate-dormancy
    title: Dormant CI-gate detector (retro-declared gates vs workflows)
    adjudication: script
    enforcer:
      - core/scripts/validate-ci-gates.sh
    call_sites:
      - site: retro.md (empirical gate validation)
        posture: reports; the retro adjudicates
        why: a gate declared in a retro and armed in no workflow is a gate that
          never fires — and it reads, in every later retro, as a gate that passed
    ci_workflow: core/ci-templates/validate-ci-gates.yml

  - id: compact-window-ordering
    title: Context-band lead constants keep yellow < red < imminent < compaction
    adjudication: script
    enforcer:
      - core/scripts/validate-compact-window.sh
    call_sites:
      - site: SKILL.md Rule 2 (context-budget setup)
        posture: advisory — the operator sets autoCompactWindow, the lead verifies
        why: the bands are a clamped percentage of the resolved effective window,
          so red fires before compaction by construction; the script guards the band
          constants (disjoint clamp ranges, monotonic percentages, runway) and reports
          the resolved window, but the window itself is settings state no gate can
          repair, so the honest posture stays "check and tell the operator"

  - id: story-provenance-cross-check
    title: Story-provenance CROSS-CHECK (Check 17 readiness arms) — the block on a
      story is the RIGHT block, not merely a schema-shaped one
    adjudication: script
    enforcer:
      - core/scripts/stamp-story-provenance.sh
    call_sites:
      - site: gate-validation.md Check 17 (story + bug-fix story readiness arms)
        posture: FAILS the gate — `--check` exit 0 is required on both arms, and
          Check 17's PASS line is "all required provenance scripts exit 0"
        why: validate-provenance-block.sh proves a block is schema-SHAPED. It cannot
          prove the block belongs to THIS story or to this sprint's terminal
          convergence pass, so a block invented, copied stale from the previous
          sprint, or edited after the fact passes it. `--check` re-runs the writer
          without writing — every batch-invariant field compared against the terminal
          pass, artifact_sha against the story's current bytes — so the check cannot
          drift from the stamp. Bound here rather than on Check 17's row because the
          row's other call site is retro.md, which never invokes this script; a
          multi-site row asserts every enforcer at every site.
        note: unbound until v0.212.0, and it is the only subject I57's discriminator
          found across the whole catalog. The writer's `--check` mode read as a
          producer mention — the same false-positive shape as verdict.sh and
          wait-for-deliverable.sh — while its own two arms state "exit 0 required".
    fixtures: [tests/fixtures/story-provenance]

  - id: h2-attestation
    title: H2 harness self-test (gate-validation.md H2) — drives the real fixtures
      once per sprint, pinned to a digest of the fixture set
    adjudication: script
    enforcer:
      - core/scripts/validate-h2-attestation.sh
      - core/fixtures/check-17-bypass/run.sh
    call_sites:
      - site: gate-validation.md H2
        posture: FAILS the gate if the mechanical fixture does not hold, or if no
          valid attestation exists for this sprint at the current fixture digest
        why: the harness self-test is the only check that checks the checkers; if it
          runs nowhere, every fixture below it is decoration
    posture: FAILS the gate if the mechanical fixture does not hold, or if no valid
      attestation exists for this sprint at the current fixture digest
    cadence: >-
      once per sprint (was: every gate, 4–6× per planning phase). The fixtures
      are static; a changed byte moves the digest, voids every attestation carrying
      the old one, and forces a full re-drive. Deduplication, not pruning — the check
      keeps every tooth.
    note: >-
      H2 was previously VACUOUS, not merely repetitive. All three seed.sh files
      were echo statements describing fixtures never written to disk, so H2
      adjudicated prose. check-17-bypass's V5 additionally carried `mode: solo`,
      short-circuiting validate-provenance-block.sh's Rule 20 assertion before the
      fabricated-SHA byte-match it exists to reach. Both fixed; only item (2) is
      mechanical — items (1) and (3) remain LLM-adjudicated.

  - id: artifact-budget
    title: Artifact-size budgets (Rule 25(d)) — a sprint may not start on top of a
      living artifact it cannot afford to read
    adjudication: script
    enforcer:
      - core/scripts/validate-artifact-budget.sh
    call_sites:
      - site: route.md Step 1a (sprint start)
        posture: HARD_BLOCK
        why: the last moment an oversized artifact is cheap to fix — the sprint has
          not read it yet, and carry-over-evaluation whole-reads brief/prd/
          architecture/backlog one step later (Rule 25(b))
      - site: route.md Step 0a (resume)
        posture: HARD_BLOCK (pipeline-snapshot.md only)
        why: resume skips Steps 1-6, so Step 1a never runs, and Check 14 is AFTER the
          read. This was the one path that whole-read the snapshot with nothing in
          front of it — and route.md was the only file that did not say it whole-reads
          it, contradicting handoff.md, Rule 23(a), and this entry, since the commit
          that introduced the snapshot
      - site: gate-validation.md Check 14
        posture: FAILS the gate (pipeline-snapshot.md only)
        why: >-
          the snapshot is the only artifact that grows WITHIN a sprint, and it is
          whole-read at every gate, every resume, and every compaction. The `trim`
          remedy this verdict issues sends superseded content to
          pipeline-snapshot-history.md, which is_archive() skips BEFORE measuring —
          so the destination of this check's own remedy was the one artifact it
          could never report a number for, measured at 87 KB -> 617 KB in four weeks
          on the reference consumer, 29 commits, all del=0. rotate-snapshot-archive.sh
          bounds it, invoked at each trim rather than at retro because the trim is
          what feeds it and the trim fires per gate. The archive is not filing:
          Check 35's corpus is every tracked *.md, and 62 of 89 candidate lines
          lived only in that history, so an ignored or unstaged destination takes
          destroyed from 17 to 79 against a floor of 40 — which is why the rotator
          refuses an ignored path and stages the archive itself.
      - site: gate-validation.md Check 15 (--check-evidence)
        posture: FAILS the gate
        why: Check 14 runs the budget check and records its own result, so the
          record was the only evidence the record was true. It failed that way — a
          Check 14 cell read "PASS validate-artifact-budget.sh (exit 0)" at a gate
          where the snapshot measured 126% of budget before it and 212% after. The
          arm requires the cell to carry the measurement, which verdict.sh now puts
          in its PASS line and which cannot be transcribed out of the instruction.
      - site: retro.md Close-Out Sweep
        posture: warn-only
        why: the sprint already paid; retro reports, it does not gate
    fixtures:
      - tests/fixtures/snapshot-section-schema
      - tests/fixtures/resume-whole-read
      - tests/fixtures/snapshot-archive-rotate
      - tests/fixtures/snapshot-evidence-cell
      - tests/fixtures/inflight-row-shape
      - tests/fixtures/verdict-pass-content
      - tests/fixtures/whole-read-pool
    supersedes: >-
      the retro.md prose threshold table, which was warn-only, fired only
      at retro, and drifted from nothing because nothing else executed it; and the
      four per-file planning-artifact constants (prd/product-brief/carry-over-backlog/
      architecture), which had no derivation and whose standing remedy was to relocate
      locked requirements to satisfy them. Replaced by ONE derived number: the four are
      whole-read by exactly one reader (the Rule-24 analyst at carry-over-evaluation
      section 1), so the bound is their SUM against that reader's window. The window is
      resolved from team-roles/analyst.md at run time and falls back to 200K when
      unresolved — core ships that role file as a template, and inheriting the
      reference consumer's 1M would fail this HARD_BLOCK open for everyone else.

  - id: steering-budget
    title: Operator steerability (Rule 29) — no foreground call may outlast the
      steering budget; no operator message may be steamrolled; no wait sequence
      may run past its beat ceiling without a re-dispatch
    adjudication: script
    enforcer:
      - core/scripts/validate-steering-budget.sh
      - core/hooks/ai-dlc-acknowledge.sh
    call_sites:
      - site: gate-validation.md Check 25
        posture: FAILS the gate on a NEW violation since the previous gate
        why: >-
          Rule 29 binds every phase that dispatches, and planning dispatches most
          — S290 ran 28 of its 28 spawns there. The delta bound is load-bearing: the
          scan is whole-session, so a raw FAIL would re-report a violation from three
          gates ago forever, could never be remediated, and an unpassable gate gets
          turned off. Compare against the previous gate-log entry's
          steering_violations; only an INCREASE fails.
      - site: retro.md (close-out sweep)
        posture: reports; the retro adjudicates
        why: the sprint has already paid — retro records the conduct, it cannot
          prevent it
      - site: ai-dlc-acknowledge.sh (PreToolUse)
        posture: runtime DENY (Check B only — the pause-flag steamroll)
        why: B is the only one of the four that can be adjudicated before the harm,
          because the flag's state is knowable at call time
    checks:
      - id: A
        asserts: no foreground tool call blocks longer than steering_budget
          (120s). FOREGROUND ONLY — the check skips run_in_background calls, and
          the backgrounded beat is bounded by its own quantum
          (AI_DLC_WAIT_BEAT_SECS, 600s) in wait-for-deliverable.sh, not by this.
          The two shared one env var until v0.167.0
        protects: the operator's voice — an over-budget call is a window in which
          a queued message cannot land
      - id: B
        asserts: no operator message is followed by a pipeline-advancing call
          before the pause flag is cleared
        protects: the operator's authority — a steer that is executed through was
          not a steer
        excludes: the auto-compaction resume prompt (a harness injection; the lead
          advancing after one is the POST-COMPACT RECOVERY PROTOCOL, not a
          steamroll)
      - id: C
        asserts: no run of foreground _bmad-output/ file-wait beats exceeds
          max_wait_beats (default 6) without an intervening re-dispatch
        protects: liveness, NOT steerability — every beat is a tool boundary, so
          an unbounded wait is a hang, not a gag
        status: dormant — zero catches across 278 consumer sessions. Bounds a shape
          Rule 29 itself introduces (beats become the sanctioned way to wait, so
          beating forever becomes the way to hang). See Rule 29 minimum-mechanism.

  - id: dispatch-model-binding
    title: Teammate dispatch model binding (v0.70.0) — a teammate runs on the model
      its role file pins, and a dispatch that omits the model param does not
      silently inherit the lead's
    adjudication: script
    hard_block: true
    enforcer:
      - core/hooks/ai-dlc-dispatch-guard.sh
    call_sites:
      - site: ai-dlc-dispatch-guard.sh (PreToolUse Agent|Task) — THE ONLY TEETH
        posture: runtime DENY of a role-bound dispatch whose model tier disagrees
          with the role file's pin, or which passes no model param at all
        why: >-
          there is NO gate-time backstop and there cannot be one — an
          Agent-spawned teammate leaves no transcript, so nothing downstream can
          learn what model it ran on, and a verdict that self-reports its own
          model is the trust circularity that keeps H1/H2 with the lead. The
          dispatch param is the only observable ground truth and it is observable
          BEFORE the work. Measured on graph S291 (v0.70.0 Sonnet-lead A/B):
          the lead dropped the param on 3 of 42 spawns, so every remediator ran
          Sonnet against an opus pin — and an inherited gate-adjudicator would
          collapse the v0.62.0 Opus escalation to Sonnet-judging-Sonnet while
          Check 26 still passed green.
    checks:
      - id: pin-agreement
        asserts: a dispatch binding team-roles/<role>.md requests a model whose
          tier matches that file's declared pin
        protects: the role file as the single source of truth for a teammate's
          model — v0.62.0's Opus escalation and v0.56.0's fresh-context repair
          both rest on it
      - id: no-silent-inherit
        asserts: a role-bound dispatch names a model explicitly
        protects: against absence reading as assent — an omitted param inherits
          the lead's model, which is luck, not binding
        excludes: roles that declare no pin (cis/sm/tea/ux) — a role file that
          declares nothing cannot bind anything; closing that needs new setup
          placeholders (the v0.63.0 unregistered-drift surface) and is deferred
    fixtures: [tests/fixtures/dispatch-model-guard]
    ci_workflow: ~

  - id: arm-record
    title: Lead arm record (v0.70.0) — which model the lead ran on is written from
      the transcript by a hook, never self-reported
    adjudication: script
    hard_block: false
    enforcer:
      - core/hooks/ai-dlc-context-sensor.sh
    emits: arm-log.jsonl   # {v,ts,sprint,lead_model}, deduped on (sprint, model)
    call_sites:
      - site: ai-dlc-context-sensor.sh (Stop | PostToolBatch)
        posture: appends an arm record on a (sprint, model) change; never blocks
        why: >-
          no sprint artifact recorded the arm, so "which arm ran" was
          unfalsifiable from a sprint's own artifacts and the v0.70.0 A/B had to
          be answered by an external script reading ~/.claude/projects. The lead
          must not self-report it: a model naming its own weights is unreliable,
          and a self-reported arm is the same unfalsifiable testimony the finding
          complains about. The sensor already exits on agent_id (main session
          only, so the model it reads IS the lead's) and already holds the correct
          post-compaction record.
    checks:
      - id: transcript-sourced
        asserts: lead_model is read from the transcript's assistant record, not
          asserted by the lead
        protects: falsifiability of any future model A/B
    fixtures: [tests/fixtures/context-sensor]
    ci_workflow: ~

  - id: subagent-context-probe
    title: Subagent context probe (v0.70.0) — measures how close teammates come to
      the compaction threshold, and whether any actually compact
    adjudication: script
    hard_block: false
    enforcer:
      - core/hooks/ai-dlc-subagent-probe.sh
    emits: subagent-context.jsonl   # {v,ts,sprint,agent_id,model,role,turns,peak_tokens,compactions,duration_s}
    call_sites:
      - site: ai-dlc-subagent-probe.sh (SubagentStop)
        posture: records only; NEVER blocks (a blocking SubagentStop hook hangs a teammate)
        why: the lead is netted around compaction (snapshot, precompact sidecar,
          recovery protocol, context sensor). A teammate has NONE of it and runs in
          its own window — the sensor deliberately exits on agent_id. If a teammate
          compacts it silently loses the middle of its task and returns a confident,
          degraded verdict. That risk was argued but never measured. The reason
          recorded here was that teammates leave no transcript in ~/.claude/projects
          and SubagentStop hands us the teammate's own; BOTH halves were false, and
          they contradict each other. Teammates DO leave a transcript, at
          <slug>/<session-uuid>/subagents/agent-<agent_id>.jsonl, and transcript_path
          points at the LEAD's session file. Every field this probe emitted was
          therefore the lead's until the reads were repointed, so the
          autoCompactWindow question was argued from lead data and is still open.
    checks:
      - id: peak-not-last
        asserts: peak_tokens is the maximum across the run, including before any
          compact_boundary
        protects: the ceiling decision — reporting the LAST reading would show a
          teammate that compacted at 286K as a calm 41K, which is worse than no
          reading at all
      - id: never-blocks
        asserts: the hook emits nothing on stdout and always exits 0
        protects: teammate liveness
    fixtures: [tests/fixtures/subagent-probe]
    ci_workflow: ~
