    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: OVERRIDE-DRIFT-FILE
    fixture: none

  - id: LC-O8
    subject: override
    level: WARN
    since: 1
    normative: >-
      An anchor that no longer exists in the incoming ref is reported; upstream restructured
      and the shadow now points at nothing.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: OVERRIDE-ANCHOR-UNRESOLVED
    fixture: none

  - id: LC-O9
    subject: override
    level: WARN
    since: 1
    normative: >-
      An override's body does not delegate to a construct defined inside a section it shadows.
      Precedence replaces that section at load time, including the delegation target, so it
      reads as a correct single-source delegation and behaves as a dropped one.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: OVERRIDE-DELEGATES-INTO-SHADOW
    fixture: layer-readopt-gate

  - id: LC-O14
    subject: override
    level: WARN
    since: 3
    normative: >-
      An override's body does not assert that the section it shadows is unchanged or still
      governs. Precedence replaces the whole shadowed span at load time, so a body that
      rewrites part of it and states the rest survives is false about its own effect — and
      unlike LC-O9 it does not point at the dropped text, it tells the reader the text is
      still there.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: OVERRIDE-ASSERTS-SHADOW-SURVIVES
    fixture: layer-readopt-gate

  - id: LC-O10
    subject: override
    level: ERROR
    since: 2
    normative: >-
      An override declares `reason:`. It is the only record of WHY this consumer diverges, and a
      later re-adoption has nothing to adjudicate the divergence against without it.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E8
    fixture: layer-anchor-declaration

  - id: LC-O11
    subject: override
    level: ERROR
    since: 2
    normative: >-
      Every `shadows:` anchor is a heading the target file FORWARD-matches — the heading contains
      the anchor. An anchor that instead CONTAINS the heading declares a finer grain than a
      heading, which the resolver cannot address, so it silently widens the shadow to that whole
