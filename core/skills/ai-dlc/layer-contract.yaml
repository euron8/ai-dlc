    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: W3

  # --- the layer conformance adjudication -----------------------------------------------
  #
  # These two are the MECHANISM of `level: ADJUDICATED`, not clauses about a consumer's
  # authoring. They are stated as clauses anyway, and deliberately: the codes below are emitted
  # by a declared enforcer, so I36's reverse direction requires a clause to claim each one, and
  # an unclaimed code is precisely the "an operator is handed a verdict with no stated rule
  # behind it" state that direction exists to make unrepresentable.
  - id: LC-A1
    subject: any
    level: ERROR
    since: 7
    normative: >-
      Every row of a clause at `level: ADJUDICATED` has a verdict recorded in
      `_bmad-output/ai-dlc-update/layer-adjudication-register.jsonl` under the subject digest
      that row fired on. Unrecorded blocks `apply`. The record is keyed by the SUBJECT STATE, so
      a later pull that moves either the entry or the core text it hooks re-fires the duty
      rather than inheriting the old verdict — a record keyed by path alone would be a permanent
      exemption wearing an adjudication's clothes.
    prose_home: core/skills/ai-dlc-update/SKILL.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: HARD-LAYER-ADJUDICATION-MISSING

  - id: LC-A2
    subject: any
    level: ERROR
    since: 7
    normative: >-
      Two register records under one key do not state different verdicts unless the later one
      declares `supersedes` and a `reason`. Retraction stays available; it has to be declared.
      Undeclared, the register answers a lookup with whichever record happens to be read, and
      the blocking half of LC-A1 then depends on file order.
    prose_home: core/skills/ai-dlc-update/SKILL.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: HARD-REGISTER-CONTRADICTION
