      sibling entry still defines is not retired: the citation lands. Where the id history
      cannot be read — a shallow clone, a missing git, a tracked file whose diff history yields
      none of the ids it currently defines — the clause REFUSES, naming and counting the entries
      it did not judge, because an unreadable history and a clean one produce the same empty
