# LAYER_CONTRACT v1
#
# THE OPERATING CONTRACT A CONSUMER'S `overrides/` AND `extensions/` ENTRIES MUST HOLD.
#
# THE DEFECT THIS FILE EXISTS TO END. The contract was real and it was scattered: normative
# clauses lived across `overrides/README.md`, `extensions/README.md`, `SKILL.md` Rule 27 and
# `core-manifest.md`, with no single home, no version, and no verdict. Measured on the
# reference consumer at v0.180.0: of the clauses those four files state, THIRTEEN were enforced
# by `validate-layer-entries.sh` or `reconcile/layer-drift.sh`, seven elsewhere, four only
# partially, and SEVENTEEN by nothing at all — three of those admitting it verbatim in their own
# prose (`extensions/README.md` still carries "No scanner enforces it" and "this rule is
# unenforced" at the restriction clause). Both reporters returned `0 error(s), 0 warning(s)`
# and exit 0 on a tree carrying real violations. That is this repo's named defect class — a
# check that cannot fire reads exactly like one that passed — applied to the contract itself.
#
# WHY A SEPARATE FILE AND NOT `enforcement-map.yaml`. That map is scoped to the gate-check
# catalog, and I1/I2/I3 assert set-equality against `steps/gate-validation.md`'s CHECK_LOADED
# anchors. A layer clause has no such anchor, so every clause added there is either an I1/I2
# failure or an exemption, and each exemption weakens the invariant that keeps that file honest.
# Same shape, same validator, different subject.
#
# WHY IT IS `machinery:` IN core-manifest.md. A consumer does not override the contract it is
# held to. Precedent: `core-manifest.md` classifies itself as machinery for the same reason.
#
# THE BINDING IS ON A TOKEN THE ENFORCER EMITS — `code:` is `E1`..`W6` for the authoring-time
# validator, or the literal pull-time status string for the drift classifier. The join cannot
# rot into a second vocabulary that has to be hand-synced, and I36 runs it in BOTH directions,
# so a clause naming a code its enforcer does not emit fails the build AND a code an enforcer
# emits that no clause claims fails the build. The seventeen-unenforced state and its mirror,
# an undocumented status, both become unrepresentable.
#
# THIS PARAGRAPH USED TO SAY "ALREADY EMITS" AND THAT WAS MEASURABLY FALSE FOR TWENTY OF THE
# FORTY-THREE CLAUSES. I36 tests it with `grep -qF` over the WHOLE enforcer file, comments
# included. Measured at contract_version 9: of the 22 codes bound to validate-layer-entries.sh,
# EIGHTEEN appeared nowhere in it but comments and two more only inside a neighbouring code's
# message prose; both GM codes were comment-only as well. Those clauses satisfied this file's
# central join on text no run could ever print — so no finding they produced could be joined
# back to the rule behind it, and a clause whose code no code path emits reads to I36 exactly
# like one that passed. The word "already" was the tell: nothing had been sprinkled into the
# scripts to make the join work, and that was being reported as a virtue.
#
# The fix is that the code is now an ARGUMENT to the emitter rather than a token in its prose,
# and **I64** holds it there — per-enforcer, keyed on the emission site rather than on the file.
# The count of clauses satisfying the join on a comment is 0 and cannot rise without failing
# the build.
#
# `level:` is what happens on violation.
#   ERROR  mechanized, no false-positive path, BLOCKS. Authoring-time: non-zero exit, so the
#          consumer's own pre-push refuses. Pull-time: the `HARD-` prefix blocks `apply`.
#   WARN   mechanized, false-positive set measured and enumerated, NEVER blocks. The policy
#          `validate-layer-entries.sh` states applies: a linter that errors dozens of times on
#          first contact gets disabled, and then catches nothing.
#   ADJUDICATED
#          candidate set mechanized, VERDICT HUMAN. The clause's own code fires exactly as a
#          WARN does; what the level adds is a recorded-verdict duty, enforced by LC-A1 against
#          `_bmad-output/ai-dlc-update/layer-adjudication-register.jsonl`. Unrecorded BLOCKS;
#          recorded costs one extra row and no decision. THE RITUAL NAME, used verbatim wherever
#          this is described: *the layer conformance adjudication*.
#
#          WHY A THIRD LEVEL AND NOT A FOURTH STATUS. Some clauses cannot be decided by a
#          predicate and must not therefore go unenforced. `extensions/README.md` states the
#          additive-only restriction and then says of it, in its own prose, "No scanner enforces
#          it" and "this rule is unenforced" — because the re-read that WOULD enforce it is a
#          judgement. Before this level the only home for such a clause was WARN, which reprints
#          the same row every pull with no way to say "this one was looked at", so the operator
#          learns to clear the worklist rather than read it. Measured on the reference consumer
#          at the pull this level shipped for: SEVENTEEN of thirty-three extension entries carry
#          that row.
#
#          THE LEVEL IS READ, NOT DECLARED. `reconcile/layer-drift.sh` derives the ADJUDICATED
#          code set from THIS FILE at THEIRS and applies the duty to exactly those rows. Moving a
#          clause to this level is a one-line edit here and no script change, and there is no
#          hand-list of adjudicable statuses anywhere to drift from it. Until this level existed
#          `level:` had NO behavioural reader in the tree — it was checked for presence by I37
#          and read by nothing.
#
# `fixture:` NAMES THE PROOF THAT THE CLAUSE'S CODE ACTUALLY FIRES, and it is the last of the
# charter's promised per-clause fields to arrive. `enforcer:` + `code:` say a mechanism exists;
# I64 says the code reaches a site a run can attribute. NONE of that says anything ever makes it
# speak. A clause can satisfy I36, I37 and I64 with an enforcer arm no fixture has ever driven,
# which is this repo's named class one level up: an unexercised arm reads exactly like an
# exercised one that passed.
#
# THE VALUE IS A BARE DIRECTORY NAME UNDER `core/fixtures/`, OR THE LITERAL `none`. I65 verifies
# the declared pair; it never derives one, and the reason is measured. A derived join ("which
# fixture names this code") has a non-empty false-positive set at every grain tried: at word
# grain `E4` matches `LC-E4`; at token grain `W2` and `W3` match `core/fixtures/release-version-
# triple/`, where they are SHELL VARIABLE NAMES. That second false positive was not merely noise
# — it scored LC-R1 as covered while `W3` is exercised by no fixture at all, so the reason to
# reject the derived join was also what hid a real gap.
#
# What I65 requires of a declared directory: it exists, it carries a `run.sh` (a driverless dir
# is skipped by the pre-push loop in silence — I20's finding), it NAMES THE CLAUSE'S OWN
# ENFORCER, and it names the clause's `code:` on a line that is neither a comment nor a seeded
# contract `code:` declaration. The enforcer scope is load-bearing: `validate-enforcement-map.sh`
# has its own `W1` and `W2`, so without it a fixture for a different script satisfies the join on
# a token collision. The comment exclusion is I64's hole arriving one file over — a fixture header
# sentence listing the checks it covers is prose ABOUT the proof, not the proof.
#
# `none` IS DATA, NOT AN EXEMPTION. A clause nothing exercises is a counted gap the build reports,
# which is exactly what the charter asked this field to state. A reverse arm stops it decaying
# into the exemption it looks like: a clause may not declare `none` while a fixture exists that
# would satisfy the join, so writing a fixture and forgetting the clause fails the build instead
# of leaving the gap on the books forever. Measured at contract_version 9, when the field shipped:
# 29 clauses declare a fixture, 14 declare `none`.
#
# `predicate:` AND `fp:` ARE DELIBERATELY NOT HERE, and both dispositions were measured rather
# than assumed. They are the charter's last two per-clause promises and each fails a different
# test this repo already applies:
#
#   `predicate:`  an evaluable predicate in a data file is a SECOND IMPLEMENTATION of the
#                 enforcer's logic, joined to the first by nothing. The repo has a live reading
#                 on what happens to a restated field: I61 found THREE severity drifts one
#                 release after the bullet carrying them was rewritten, and that field had a
#                 mechanical join available. Prose-vs-shell has no I61-equivalent and none is
#                 constructible. What the promise wanted — a row stating what the clause tests —
#                 is carried by `normative:` (present on all 43, and the only field a human
#                 reads), bound to a mechanism by `code:` + I64 and to a proof by `fixture:` +
#                 I65. Recorded as subsumption WITH the measurement, not dropped as hard.
#
#   `fp:`         a false positive is a JUDGEMENT about a run, so no run can emit it. Stored, the
#                 cell passes v0.123.0's test — *can this be written without the run?* — with a
#                 plain yes, which is the definition of forgeable here. It is not "another
#                 mechanism covers it": it is that no mechanism can, the same ground on which the
#                 crosswalk-completeness clause was correctly refused under I37. The duty it
#                 encodes survives as a duty: this plan's own verification section requires a
#                 measured false-positive set, empty or enumerated, per shipped check, and that
#                 measurement lands in the release that ships the check.
#
# `since:` is the contract_version that introduced the clause. Upstream adds clauses at a higher
# `since` and never rewrites a lower one, which is the same additive, consumer-wins discipline
# that lets `aiDlcRoles` in settings.json reconcile with zero drift. At contract_version 1 every
# clause is `since: 1` and every clause already had a live enforcer before this file existed, so
# declaring the contract changes NO consumer's verdict by one byte.
#
# `conforms_to:` ON AN ENTRY IS A RECEIPT, NOT AN EXEMPTION, AND THIS PARAGRAPH REPLACES THE ONE
# THAT SAID OTHERWISE. For eight contract versions this file stated the rule as *"an entry
# declaring `conforms_to: N` is held only to clauses with `since <= N`"* — a skip. Nothing read
# the field, so nothing exercised that semantics, and building it as specified would have shipped
# a one-line-per-file escape hatch from every clause core had allocated since: the reference
# consumer's 49 band ERRORs, allocated at `since: 4` and `since: 8`, would have been erased by
# writing `conforms_to: 3` into thirteen files. Core is the source of truth; a consumer does not
# self-declare which of core's clauses bind it.
#
# So what N buys is SCOPE, never silence. `validate-layer-entries.sh` reads it and reports, per
# entry, exactly which clause ids postdate the declaration — that entry's migration worklist,
# named rather than guessed — and every clause fires regardless. The retro-application problem
# the skip was aimed at (a new clause wedging every consumer on first contact) is real, and it is
# solved one level up where it belongs: core ships a new clause at WARN and promotes it to ERROR
# in a later release once the migration has landed. That is core's decision, taken in the open in
# a release, not a consumer's declaration taken per file. LC-N5's promotion from its retired
# warn-tier code to `E15` at contract_version 8 is the worked example.
#
# WHAT IS DELIBERATELY NOT HERE. The seventeen clauses with no enforcer are absent, not listed
# as pending: I37 rejects a clause without a live enforcer, and `enforcement: pending` would be
# the same declaration-without-a-mechanism defect wearing a new file's clothes. They are named
# in the CHANGELOG as the backlog and arrive with their enforcers, one release at a time.

contract_version: 13

# WHERE A CONSUMER'S CROSSWALK ROWS LIVE. Declared here, and here rather than in
# `core-manifest.md`, for a reason that was measured rather than argued.
#
# LC-N6 and LC-R2 name this file's location in their normative text; the enforcer reads it to
# evaluate them. Putting the declaration in the manifest made the reader require a file that
# 55 of the 63 fixture seeds touching a synthetic consumer do not build — an ERROR on a
# subject population that is entirely harness. Every one of those seeds already copies THIS
# file, because E17 reads `contract_version` out of it, so the same declaration here has a
# false-positive set of zero. A constant belongs beside the clauses that cite it.
#
# `reconcile/setup-sites.md` carries the twin, and I67 binds them: `ai-dlc-update` is
# self-contained by a HARD CONSTRAINT and may not read pipeline files, so the updater and the
# validator would otherwise agree only by coincidence. The path is CONSUMER-relative and
# identical in both layouts, so there is nothing to map.
#
# It is NOT `extensions/README.md`, which is where it was through contract version 10. That
# file is core's — the distribution ships it and every pull compares a consumer's copy against
# base — so LC-N6, an ERROR, had its only compliant output inside a file the consumer does not
# own. The reference consumer's migration wrote nineteen rows there and earned a permanent
# `HARD-UNREGISTERED-CORE-DRIFT` whose two printed remedies respectively delete the rows and
# file them where no reader looks. LC-N7 reports rows still in the old location.
consumer_crosswalk_file: .claude/skills/ai-dlc/crosswalk.md

# THE CONSUMER'S ai-dlc MACHINERY INVENTORY. Same shape as the crosswalk above and for the
# same reason: core declares the PATH, the installer and the pull driver scaffold it once
# from a template, core never overwrites it, and every reader derives the location from here.
#
# WHY A DECLARATION AT ALL, given that eight predicates asking core to INFER which consumer
# executables are ai-dlc were all refuted. Because inference and declaration are different
# questions. Core cannot look at `scripts/foo.sh` and decide whether it serves the ai-dlc
# process or the consumer's own domain -- that question is genuinely undecidable from core's
# side, and re-attempting it is this program's most repeated mistake. But a consumer CAN say
# which of its scripts are ai-dlc machinery, and once it has said so, "is this declared file
# in the declared home" is decidable by string comparison.
#
# WHAT THIS CANNOT DO, stated here rather than discovered later: it cannot catch
# UNDER-declaration. A consumer that omits a script from the inventory makes it invisible,
# and no clause here pretends otherwise. The inventory is a reviewable artifact plus
# mechanical segregation of everything in it -- not a proof that it is complete.
consumer_machinery_file: .claude/skills/ai-dlc/machinery.md

# THE FILES THIS CONTRACT ABSORBED, and what each one is NOW. Held to the tree by I63; the
# codes any of them names are held to their clauses by I62.
#
# The header above names the scatter this file was created to end. That naming was prose, so
# "the prose homes are reduced to pointers" stayed a sentence for nineteen releases while two
# of the four contributed zero clauses with nothing able to say so — `prose_home:` is written
# per clause, so a file that stops carrying them stops appearing, and its silence is identical
# to a file that was never in scope.
#
#   home     states clauses, and is the declared prose_home of at least one.
#   pointer  states none of its own and refers to clauses homed elsewhere. Every contract code
#            it names must cite the clause that claims it (I62), which is what stops a pointer
#            from drifting back into a second, unbound copy of the rule.
#   none     carries no contract prose. Pinned so that GROWING some is a build failure rather
#            than a silent re-scattering.
#
# core-manifest.md is pinned `none` on measurement, not on the header's say-so: it names zero
# contract codes and carries zero clause bullets. The four-site list this file inherited was
# wrong about it, and recording that is cheaper than leaving a pin nobody can satisfy.
absorbed_from:
  - path: core/skills/ai-dlc/extensions/README.md
    role: home
  - path: core/skills/ai-dlc/overrides/README.md
    role: home
  - path: core/skills/ai-dlc-update/SKILL.md
    role: home
  - path: core/skills/ai-dlc/SKILL.md
    role: pointer
  - path: core/skills/ai-dlc/core-manifest.md
    role: none

clauses:

  # --- overrides/: frontmatter and provenance -------------------------------------------
  - id: LC-O1
    subject: override
    level: ERROR
    since: 1
    normative: >-
      An override declares `shadows:` and `base_sha:`, and `base_sha` is 7-40 hex characters.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E1
    fixture: layer-catalog-collision

  - id: LC-O2
    subject: override
    level: ERROR
    since: 1
    normative: >-
      `base_sha` is a DISTRIBUTION sha. A correct one never resolves in the consumer's own
      repo; a consumer sha leaves drift detection silently dead for that entry.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E2
    fixture: none

  - id: LC-O3
    subject: override
    level: ERROR
    since: 1
    normative: >-
      EVERY comma-part of `shadows:` resolves to a file that exists in core — not just the first.
      A part beginning with `#` inherits the file from the part before it; a first part with no
      file resolves to nothing and is an error.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E3
    fixture: layer-anchor-declaration

  - id: LC-O4
    subject: override
    level: ERROR
    since: 1
    normative: >-
      `base_sha` resolves in the distribution. One that resolves in neither repo makes drift
      undecidable rather than absent.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: HARD-OVERRIDE-BASE-UNRESOLVABLE
    fixture: none

  - id: LC-O5
    subject: override
    level: ERROR
    since: 1
    normative: >-
      `base_sha` is not a consumer sha at pull time either. The authoring-time check and the
      pull-time check are both required: the first is skippable, the second is not.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: HARD-OVERRIDE-BASE-CONSUMER-SHA
    fixture: none

  # --- overrides/: drift against the shadowed core text --------------------------------
  - id: LC-O6
    subject: override
    level: ERROR
    since: 1
    normative: >-
      When the shadowed core section's text changes between `base_sha` and the incoming ref,
      the override is adjudicated before `apply` proceeds. The lead reads the override, not
      core, so an unadjudicated drift is how a core fix lands while the consumer goes on
      running the rule it replaced.
    prose_home: core/skills/ai-dlc/overrides/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: HARD-OVERRIDE-DRIFT-SECTION
