    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E5

  - id: LC-E3
    subject: extension
    level: WARN
    since: 1
    normative: >-
      A `hooks:` target absent from the incoming ref is reported; the entry hooks onto
      nothing.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: EXTENSION-HOOK-MISSING

  - id: LC-E4
    subject: extension
    level: WARN
    since: 1
    normative: >-
      When the hooked core file changes, the entry is re-read and its verdict recorded as
      still-additive, contradicts-core, or retire. This re-read is the ONLY mechanism behind
      the additive-only rule; skipped, that rule is unenforced.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: EXTENSION-HOOK-DRIFT

  - id: LC-E9
    subject: extension
    level: ERROR
    since: 2
    normative: >-
      An extension declares `push_candidate:` as `true` or `false`. It is the flag the push queue
      is drained from, so an entry without it can never be offered upstream and never retired on
      absorption.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E9

  # --- extensions/: the qualifier grain (contract_version 5) ----------------------------
  # Ids taken by reading the WHOLE id set, not by counting on from the clause above this
  # insertion point — that is precisely how v0.193.0 shipped two clauses under LC-O12,
  # in a file that is not in numeric order.
  - id: LC-E10
    subject: extension
    level: ERROR
    since: 5
    normative: >-
      An extension's `kind:` is one of `check`, `step-domain`, `role`, `qualifier`. Rule 27's
      loader routes an entry by its kind, so an unrecognised one is read by nothing: the entry
      sits in the layer directory looking active and governs no run.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E10

  - id: LC-E11
    subject: extension
    level: ERROR
    since: 5
    normative: >-
      An `extends:` value names exactly one anchor, in the file the entry hooks, and that anchor
      resolves to a heading by the FORWARD containment arm. A reverse-only match silently widens
      the declared span to the whole enclosing section, so an entry would report narrowed drift
      while the classifier watched everything under that heading.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E11

  - id: LC-E12
    subject: extension
    level: ERROR
    since: 5
    normative: >-
      A `kind: qualifier` entry declares both `extends:` and `position:`, and no other kind
      declares `position:`. A qualifier renders inside a core section, so without the anchor there
      is nothing to render into and nothing to drift-check; on any other kind the key states a
      placement no loader performs.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E12

  - id: LC-E13
    subject: extension
    level: ERROR
    since: 5
    normative: >-
      A `position:` value is `append` or `prepend`. Two positions is the whole vocabulary: a
      literal-prose anchor would be a third anchor resolver, and `reconcile/lib.sh` records two
      shipped defects caused by duplicate resolvers.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E13

  - id: LC-E14
    subject: extension
    level: WARN
    since: 5
    normative: >-
      When an entry declares `extends:` and that span changes, the entry is re-read against the
      new core text. This is LC-E4's duty at the grain the entry declared rather than at file
      grain, and it is the same verdict set.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: EXTENSION-ANCHOR-DRIFT

  - id: LC-E15
    subject: extension
    level: WARN
    since: 5
    normative: >-
      An `extends:` anchor that resolves to no heading in the incoming ref is reported. Upstream
      renamed or absorbed the section away, and a span that resolves to nothing compares empty
      against empty: unreported, the narrowing would answer clean for every future change to a
      section the entry still claims to augment.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: EXTENSION-ANCHOR-MISSING

  # --- extensions/: additivity and retirement ------------------------------------------
  - id: LC-E5
    subject: extension
    level: WARN
    since: 1
    normative: >-
      An extension does not restate a core section. A duplicate that predates the entry's own
      base has been shipping unreported for some number of releases; retire it, or refile it
      as an override with a `base_sha` if it hardens core.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: EXTENSION-RESTATES-CORE

  - id: LC-E6
    subject: extension
    level: WARN
    since: 1
    normative: >-
      When upstream absorbs an entry's content, the entry is DELETED. Matched by title, so
      absorption under a different number is still caught. Upstream never writes this
      directory, so it cannot remove the entry for the consumer, and an absorbed-but-kept
      extension is the single most common way a layer rots.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: EXTENSION-RETIRE-CANDIDATE

  - id: LC-E7
    subject: extension
    level: WARN
    since: 1
    normative: >-
      A declared `fixtures:` value names a directory that exists in the consumer tree. The
      binding is what puts a consumer check's fixture into core H1's derived set, so a dangling
      one makes H1 report coverage that does not exist.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/skills/ai-dlc-update/reconcile/layer-drift.sh
    code: EXTENSION-FIXTURE-UNBOUND

  - id: LC-E8
    subject: extension
    level: WARN
    since: 1
    normative: >-
      A closed enumeration of what core accepts is a RESTRICTION, not an addition, and belongs
      in `overrides/` with a `base_sha`. Filed as an extension it carries no drift anchor, so
      when core grows a third valid value the entry silently starts contradicting it.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: W2

  # --- the shared number namespace ------------------------------------------------------
  - id: LC-N1
    subject: extension
    level: ERROR
    since: 1
    normative: >-
      A consumer check does not redefine a core check NUMBER under a different title. The
      integer renders into the same merged list as core's, so a bare `Check N` in the gate log
      — the durable audit record — would have two referents.
    prose_home: core/skills/ai-dlc/extensions/README.md
    enforcer: core/scripts/validate-layer-entries.sh
    code: E6

  - id: LC-N2
    subject: extension
