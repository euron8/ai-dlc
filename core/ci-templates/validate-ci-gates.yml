name: Validate CI gates

# Fires scripts/validate-ci-gates.sh on every pull request to detect dormant
# gates declared in retros but not wired to any workflow (shallow grep-based
# defense per FR-S153-1.3 / ADR-153-3).
#
# Blast-radius isolation: dedicated workflow (not inlined into deploy.yml or a
# PR-quality multiplexer) so a flaky dormant-gate scan cannot block service
# deployment or unrelated lint jobs.

on:
  pull_request:

jobs:
  validate-ci-gates:
    name: validate-ci-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: bash -n syntax check
        run: bash -n scripts/validate-ci-gates.sh

      - name: shellcheck (graceful-degradation if absent)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            # --severity=warning suppresses info-level findings (e.g., SC2016
            # on intentional single-quoted regex patterns). Per NFR-S153-3,
            # the intent is to catch bugs, not stylistic preferences.
            shellcheck --severity=warning scripts/validate-ci-gates.sh
          else
            echo "shellcheck not available on runner; skipping per NFR-S153-3"
          fi

      - name: validate-ci-gates
        run: bash scripts/validate-ci-gates.sh

  validate-layer-entries:
    name: validate-layer-entries
    runs-on: ubuntu-latest
    # Rule 27 layer hygiene. This linter existed, was correct, and fired on every
    # real consumer — into nothing. It was wired to no workflow anywhere, so its
    # findings (including live gate-check NUMBER COLLISIONS, where a core check and
    # a consumer extension check share one integer in the merged document and the
    # bare "Check N" written into the gate log stops having a referent) were printed
    # to a terminal nobody ran. A detector with no caller is not a detector.
    #
    # Needs full history: E2 asks whether an override's base_sha resolves in the
    # CONSUMER repo, which is how a poisoned (wrong-repo) sha is caught. A shallow
    # clone makes every sha unresolvable and the check silently vacuous.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: bash -n syntax check
        run: bash -n scripts/validate-layer-entries.sh

      - name: validate-layer-entries
        run: bash scripts/validate-layer-entries.sh
